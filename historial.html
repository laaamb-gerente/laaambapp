<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#00AFB6;--teal-d:#008a90;--teal-bg:rgba(0,175,182,.10);--teal-bg2:rgba(0,175,182,.06);
  --bg:#080f10;--bg2:#0c1517;--bg3:#101d1f;--bg4:#152224;--surface:#172628;--surface2:#1d3235;
  --border:rgba(0,175,182,.10);--border2:rgba(0,175,182,.20);--border3:rgba(0,175,182,.35);
  --green:#2ec77a;--green-bg:rgba(46,199,122,.12);--red:#e05252;--red-bg:rgba(224,82,82,.12);
  --amber:#e8a030;--amber-bg:rgba(232,160,48,.12);
  --text:#d8edef;--text2:#7eadb2;--text3:#3d6e74;
  --r:8px;--r2:14px;--sidebar:236px;--anim:.16s cubic-bezier(.4,0,.2,1);
}
html[data-theme="light"]{--bg:#F8F9FA;--bg2:#FFFFFF;--bg3:#F3F4F6;--bg4:#FAFAFA;--surface:#FFFFFF;--surface2:#F3F4F6;--border:#E5E7EB;--border2:#D1D5DB;--border3:#9CA3AF;--green:#10B981;--green-bg:rgba(16,185,129,.10);--red:#EF4444;--red-bg:rgba(239,68,68,.10);--amber:#F59E0B;--amber-bg:rgba(245,158,11,.10);--text:#1A1A2E;--text2:#6B7280;--text3:#9CA3AF}
html[data-theme="dark"]{--bg:#0F172A;--bg2:#1E293B;--bg3:#1E293B;--bg4:#162032;--surface:#1E293B;--surface2:#162032;--border:#334155;--border2:#3E4C61;--border3:#475569;--green:#10B981;--green-bg:rgba(16,185,129,.14);--red:#EF4444;--red-bg:rgba(239,68,68,.14);--amber:#F59E0B;--amber-bg:rgba(245,158,11,.14);--text:#F1F5F9;--text2:#94A3B8;--text3:#64748B}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Changa',sans-serif;font-size:14px;line-height:1.5;overflow:hidden}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:3px}
.app{display:flex;height:100vh;width:100vw}
.sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.brand{padding:16px 16px 10px;font-family:'Sigmar',cursive;font-size:20px;color:var(--teal)}
.nav-scroll{flex:1;overflow-y:auto;padding:6px 0}
.nav-group{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:12px 18px 4px}
.nav-link{display:flex;align-items:center;gap:9px;padding:8px 10px;margin:1px 8px;border-radius:var(--r);cursor:pointer;color:var(--text2);font-size:13px;text-decoration:none;transition:all var(--anim)}
.nav-link:hover{background:var(--surface);color:var(--text)}
.nav-link.active{background:var(--teal-bg);color:var(--teal);border:1px solid var(--border2)}
.nav-ico{width:17px;height:17px;flex-shrink:0;opacity:.8}
.nav-badge{margin-left:auto;font-size:10px;background:var(--surface2);color:var(--text2);border-radius:99px;padding:1px 7px}
.sb-foot{padding:12px;border-top:1px solid var(--border)}
.user-row{display:flex;align-items:center;gap:9px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.user-name{font-size:13px;font-weight:600;color:var(--text)}
.user-role{font-size:11px;color:var(--text3)}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.page-head{padding:18px 26px;border-bottom:1px solid var(--border)}
.ph-title{font-family:'Sigmar',cursive;font-size:24px;color:var(--text)}
.ph-sub{font-size:13px;color:var(--text2);margin-top:2px}
.content{padding:20px 26px 60px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:flex-end}
.filt{display:flex;flex-direction:column;gap:3px}
.filt label{font-size:11px;color:var(--text2);font-weight:600}
.filt select,.filt input{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:7px 9px;font-family:inherit;font-size:13px}
.btn{border:1px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--text);padding:8px 14px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
th{text-align:left;padding:10px 12px;background:var(--bg3);color:var(--text2);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
td{padding:9px 12px;border-top:1px solid var(--border);color:var(--text2);vertical-align:top}
td b{color:var(--text)}
tr.row-approve{background:var(--green-bg)}
tr.row-reject{background:var(--red-bg)}
tr.row-update{background:var(--amber-bg)}
.tag{display:inline-block;font-size:10px;font-weight:700;border-radius:99px;padding:2px 8px}
.tag-approve{background:var(--green-bg);color:var(--green)}
.tag-reject{background:var(--red-bg);color:var(--red)}
.tag-insert{background:var(--teal-bg);color:var(--teal)}
.tag-update{background:var(--amber-bg);color:var(--amber)}
.empty{text-align:center;color:var(--text3);padding:40px;font-style:italic}
.table-scroll{overflow-x:auto;border-radius:var(--r2)}
@media(max-width:768px){.sidebar{display:none}.content{padding:14px}table{min-width:760px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">LAAAMB</div>
    <nav class="nav-scroll" id="nav-scroll"></nav>
    <div class="sb-foot">
      <div class="user-row">
        <div class="avatar" id="hist-avatar">JG</div>
        <div><div class="user-name" id="hist-user">Usuario</div><div class="user-role" id="hist-rol">—</div></div>
      </div>
      <button onclick="Auth.signOut()" style="width:100%;margin-top:10px;padding:9px;background:transparent;border:1px solid var(--border);border-radius:var(--r);color:var(--text3);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer">Cerrar sesión</button>
    </div>
  </aside>

  <div class="main">
    <div class="page-head">
      <div class="ph-title">Historial &amp; Auditoría</div>
      <div class="ph-sub">Registro inmutable de todas las acciones</div>
    </div>
    <div class="content">
      <div style="display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:16px">
        <button id="htab-audit" onclick="histTab('audit')" style="padding:9px 16px;font-size:13px;font-weight:600;color:var(--teal);cursor:pointer;border:none;background:none;border-bottom:2px solid var(--teal);font-family:inherit">Auditoría</button>
        <button id="htab-tareas" onclick="histTab('tareas')" style="padding:9px 16px;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;font-family:inherit">Tareas</button>
      </div>

      <!-- ═══ TAREAS ═══ -->
      <div id="hist-tareas" style="display:none">
        <div style="margin-bottom:14px"><button class="btn primary" onclick="toggleNuevaTarea()">+ Nueva tarea</button></div>
        <div id="nueva-tarea-form" style="display:none;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div style="grid-column:1/-1"><label style="font-size:11px;color:var(--text3);display:block;margin-bottom:4px">Título *</label><input id="t-titulo" maxlength="80" placeholder="Ej: Vacunar grupo de monta antes de la eco" style="width:100%;padding:9px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit"></div>
            <div style="grid-column:1/-1"><label style="font-size:11px;color:var(--text3);display:block;margin-bottom:4px">Descripción</label><textarea id="t-desc" rows="2" placeholder="Opcional" style="width:100%;padding:9px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit"></textarea></div>
            <div><label style="font-size:11px;color:var(--text3);display:block;margin-bottom:4px">Área *</label>
              <select id="t-area" style="width:100%;padding:9px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit">
                <option value="reproduccion">Reproducción</option><option value="salud">Salud</option><option value="lotes">Lotes &amp; Potreros</option><option value="nutricion">Nutrición</option><option value="animales">Animales</option><option value="finanzas">Finanzas</option><option value="general" selected>General</option><option value="mantenimiento">Mantenimiento</option>
              </select>
            </div>
            <div><label style="font-size:11px;color:var(--text3);display:block;margin-bottom:4px">Asignar a *</label>
              <select id="t-asignado" class="colab-select" data-colab-ph="— Seleccionar colaborador —" style="width:100%;padding:9px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit"><option value="">Cargando…</option></select>
            </div>
            <div><label style="font-size:11px;color:var(--text3);display:block;margin-bottom:4px">Fecha límite *</label><input id="t-fecha" type="date" style="width:100%;padding:9px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit"></div>
            <div><label style="font-size:11px;color:var(--text3);display:block;margin-bottom:4px">Prioridad</label>
              <select id="t-prioridad" style="width:100%;padding:9px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit"><option value="urgente">Urgente</option><option value="alta">Alta</option><option value="normal" selected>Normal</option><option value="baja">Baja</option></select>
            </div>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
            <button class="btn" onclick="toggleNuevaTarea()">Cancelar</button>
            <button class="btn primary" onclick="crearTarea()">Crear tarea →</button>
          </div>
        </div>
        <div class="filters" style="margin-bottom:12px">
          <div class="filt"><label>Área</label><select id="tf-area"><option value="">Todas</option><option value="reproduccion">Reproducción</option><option value="salud">Salud</option><option value="lotes">Lotes</option><option value="nutricion">Nutrición</option><option value="animales">Animales</option><option value="finanzas">Finanzas</option><option value="general">General</option><option value="mantenimiento">Mantenimiento</option></select></div>
          <div class="filt"><label>Estado</label><select id="tf-estado"><option value="">Todos</option><option value="pendiente">Pendiente</option><option value="en_progreso">En progreso</option><option value="finalizada">Finalizada</option></select></div>
          <div class="filt"><label>Rango</label><select id="tf-rango"><option value="semana">Esta semana</option><option value="vencidas">Vencidas</option><option value="todas" selected>Todas</option></select></div>
          <button class="btn" onclick="renderTareas()">Filtrar</button>
        </div>
        <div id="tareas-list"><div class="empty">Cargando…</div></div>
      </div>

      <!-- ═══ AUDITORÍA ═══ -->
      <div id="hist-audit">
      <div class="filters">
        <div class="filt">
          <label>Módulo</label>
          <select id="f-modulo">
            <option value="">Todos</option>
            <option value="bajas">Bajas</option>
            <option value="tratamientos">Tratamientos</option>
            <option value="pesajes">Pesajes</option>
            <option value="eventos_reproductivos">Reproducción</option>
            <option value="__aprob">Aprobaciones</option>
          </select>
        </div>
        <div class="filt">
          <label>Usuario</label>
          <select id="f-usuario"><option value="">Todos</option></select>
        </div>
        <div class="filt">
          <label>Acción</label>
          <select id="f-accion">
            <option value="">Todas</option>
            <option value="INSERT">INSERT</option>
            <option value="UPDATE">UPDATE</option>
            <option value="APPROVE">APPROVE</option>
            <option value="REJECT">REJECT</option>
          </select>
        </div>
        <div class="filt"><label>Desde</label><input type="date" id="f-desde"></div>
        <div class="filt"><label>Hasta</label><input type="date" id="f-hasta"></div>
        <button class="btn" onclick="window.Hist.aplicar()">Filtrar</button>
        <button class="btn primary" onclick="window.Hist.exportCSV()">Exportar CSV</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th>Fecha/hora</th><th>Usuario</th><th>Rol</th><th>Acción</th>
            <th>Módulo</th><th>Registro</th><th>Detalle</th><th>Aprobado por</th>
          </tr></thead>
          <tbody id="hist-tbody"><tr><td colspan="8" class="empty">Cargando…</td></tr></tbody>
        </table>
      </div>
      </div><!-- /hist-audit -->
    </div>
  </div>
</div>

<script>
// ── Guard: solo gerente / administrador ──
(function(){
  function rol(){ return window.AUTH_ROL || (window.AUTH_PERFIL && window.AUTH_PERFIL.rol) || ''; }
  function check(){ var r = rol(); if(r && r!=='gerente' && r!=='administrador'){ location.replace('index.html'); return true; } return false; }
  if(check()) return;
  document.addEventListener('DOMContentLoaded', check);
  document.addEventListener('appstate:ready', check);
})();

// ── Historial & Auditoría ──
(function(){
  var FINCA_ID = (window.AppState && window.AppState._finca_id) || 'a1b2c3d4-0000-0000-0000-000000000001';
  var ROWS = [];
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function fmtTs(ts){ if(!ts) return '—'; try{ var d=new Date(ts); return d.toLocaleDateString('es-CO')+' '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ts; } }
  function moduloLabel(m){ return ({bajas:'Bajas',tratamientos:'Tratamientos',pesajes:'Pesajes',eventos_reproductivos:'Reproducción'}[m])||m||'—'; }
  function detalle(r){
    if(r.nota) return r.nota;
    var d = r.datos_despues || r.datos_antes;
    if(!d) return '—';
    try{ return Object.keys(d).slice(0,4).map(function(k){ return k+': '+(typeof d[k]==='object'?JSON.stringify(d[k]):d[k]); }).join(' · '); }catch(e){ return '—'; }
  }
  function aprobadoPor(r){ return r.aprobado_por_email || ((r.accion==='APPROVE'||r.accion==='REJECT')?r.usuario_email:'') || '—'; }

  function rowClass(a){ return a==='APPROVE'?'row-approve':a==='REJECT'?'row-reject':a==='UPDATE'?'row-update':''; }
  function tagClass(a){ return a==='APPROVE'?'tag-approve':a==='REJECT'?'tag-reject':a==='UPDATE'?'tag-update':'tag-insert'; }

  function filtrar(){
    var fm = document.getElementById('f-modulo').value;
    var fu = document.getElementById('f-usuario').value;
    var fa = document.getElementById('f-accion').value;
    var fd = document.getElementById('f-desde').value;
    var fh = document.getElementById('f-hasta').value;
    return ROWS.filter(function(r){
      if(fm==='__aprob'){ if(r.accion!=='APPROVE' && r.accion!=='REJECT') return false; }
      else if(fm && r.modulo!==fm) return false;
      if(fu && r.usuario_email!==fu) return false;
      if(fa && r.accion!==fa) return false;
      if(fd && (!r.timestamp || r.timestamp.slice(0,10) < fd)) return false;
      if(fh && (!r.timestamp || r.timestamp.slice(0,10) > fh)) return false;
      return true;
    });
  }

  function render(){
    var rows = filtrar();
    var tb = document.getElementById('hist-tbody');
    if(!rows.length){ tb.innerHTML = '<tr><td colspan="8" class="empty">Sin registros para los filtros seleccionados.</td></tr>'; return; }
    tb.innerHTML = rows.map(function(r){
      return '<tr class="'+rowClass(r.accion)+'">'
        + '<td>'+esc(fmtTs(r.timestamp))+'</td>'
        + '<td><b>'+esc(r.usuario_email||'—')+'</b></td>'
        + '<td>'+esc(r.usuario_rol||'—')+'</td>'
        + '<td><span class="tag '+tagClass(r.accion)+'">'+esc(r.accion||'')+'</span></td>'
        + '<td>'+esc(moduloLabel(r.modulo))+'</td>'
        + '<td style="font-family:monospace;font-size:11px">'+esc((r.registro_id||'').slice(0,8))+'</td>'
        + '<td>'+esc(detalle(r))+'</td>'
        + '<td>'+esc(aprobadoPor(r))+'</td>'
        + '</tr>';
    }).join('');
  }

  function poblarUsuarios(){
    var sel = document.getElementById('f-usuario');
    var seen = {};
    ROWS.forEach(function(r){ if(r.usuario_email && !seen[r.usuario_email]){ seen[r.usuario_email]=1; var o=document.createElement('option'); o.value=r.usuario_email; o.textContent=r.usuario_email; sel.appendChild(o); } });
  }

  function exportCSV(){
    var rows = filtrar();
    var head = ['Fecha/hora','Usuario','Rol','Accion','Modulo','Registro','Detalle','Aprobado por'];
    var lines = [head.join(',')];
    rows.forEach(function(r){
      var cols = [fmtTs(r.timestamp), r.usuario_email||'', r.usuario_rol||'', r.accion||'', moduloLabel(r.modulo), r.registro_id||'', detalle(r), aprobadoPor(r)];
      lines.push(cols.map(function(c){ return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'; }).join(','));
    });
    var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'historial_auditoria_'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  async function load(){
    try{
      var res = await window.DB.getAuditLog(FINCA_ID, 500);
      ROWS = (res && res.data) || [];
    }catch(e){ ROWS = []; }
    // Datos del usuario en el footer del sidebar
    var u = (window.AUTH_PERFIL && (window.AUTH_PERFIL.email||window.AUTH_PERFIL.nombre)) || 'Usuario';
    document.getElementById('hist-user').textContent = u;
    document.getElementById('hist-rol').textContent = window.AUTH_ROL || '—';
    poblarUsuarios();
    render();
  }

  window.Hist = { aplicar: render, exportCSV: exportCSV };
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', load); } else { load(); }
})();
</script>

<script>
// ════════════════════════════════════════════════════════════════════════════
//  MÓDULO DE TAREAS (crear/asignar/finalizar) — historial.html (gerente/admin)
// ════════════════════════════════════════════════════════════════════════════
var FINCA_TAREAS='a1b2c3d4-0000-0000-0000-000000000001';
window._tareas = window._tareas || [];
function _tEsc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
function _tToast(msg){
  var c=document.getElementById('t-toasts');
  if(!c){ c=document.createElement('div'); c.id='t-toasts'; c.style.cssText='position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px'; document.body.appendChild(c); }
  var t=document.createElement('div'); t.style.cssText='background:var(--bg2);border:1px solid var(--border2);border-left:3px solid var(--teal);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--text);box-shadow:0 4px 20px rgba(0,0,0,.4)'; t.textContent='✓ '+msg;
  c.appendChild(t); setTimeout(function(){ t.remove(); },3000);
}
var AREA_LBL={reproduccion:'Reproducción',salud:'Salud',lotes:'Lotes & Potreros',nutricion:'Nutrición',animales:'Animales',finanzas:'Finanzas',general:'General',mantenimiento:'Mantenimiento'};
function _fmtTarea(iso){ if(!iso) return '—'; try{ var d=new Date(iso+'T00:00:00'); var p=function(n){return (n<10?'0':'')+n;}; var M=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']; return p(d.getDate())+'/'+M[d.getMonth()]+'/'+d.getFullYear(); }catch(e){ return iso; } }

function histTab(t){
  var isT = t==='tareas';
  document.getElementById('hist-audit').style.display = isT?'none':'block';
  document.getElementById('hist-tareas').style.display = isT?'block':'none';
  var a=document.getElementById('htab-audit'), b=document.getElementById('htab-tareas');
  a.style.color=isT?'var(--text3)':'var(--teal)'; a.style.borderBottomColor=isT?'transparent':'var(--teal)';
  b.style.color=isT?'var(--teal)':'var(--text3)'; b.style.borderBottomColor=isT?'var(--teal)':'transparent';
  if(isT) loadTareas();
}
function toggleNuevaTarea(){
  var f=document.getElementById('nueva-tarea-form');
  var show=f.style.display==='none';
  f.style.display=show?'block':'none';
  if(show){
    document.getElementById('t-titulo').value='';
    document.getElementById('t-desc').value='';
    document.getElementById('t-area').value='general';
    document.getElementById('t-prioridad').value='normal';
    var man=new Date(); man.setDate(man.getDate()+1);
    document.getElementById('t-fecha').value=man.toISOString().slice(0,10);
    if(window.fillColabSelect) fillColabSelect('t-asignado','— Seleccionar colaborador —');
  }
}
async function crearTarea(){
  var titulo=(document.getElementById('t-titulo').value||'').trim();
  if(!titulo){ alert('El título es obligatorio'); return; }
  var asigSel=document.getElementById('t-asignado');
  var asigNombre=asigSel.value;
  if(!asigNombre){ alert('Asigna la tarea a un colaborador'); return; }
  var fecha=document.getElementById('t-fecha').value;
  if(!fecha){ alert('Selecciona la fecha límite'); return; }
  // Resolver el uuid del colaborador (asignado_a) para que case con hoy.html
  var asigUuid=null;
  try{
    if(window.DB && window.DB.getColaboradores){
      var rc=await window.DB.getColaboradores(FINCA_TAREAS);
      var match=((rc&&rc.data)||[]).find(function(c){ return (c.nombre||c.email)===asigNombre || c.email===asigNombre; });
      if(match) asigUuid=match.id;
    }
  }catch(e){}
  var payload={
    titulo:titulo, descripcion:(document.getElementById('t-desc').value||'').trim()||null,
    area:document.getElementById('t-area').value, fecha_vencimiento:fecha,
    prioridad:document.getElementById('t-prioridad').value,
    asignado_a:asigUuid, asignado_nombre:asigNombre,
    creado_por:(window.AUTH_PERFIL&&window.AUTH_PERFIL.id)||null,
    creado_nombre:(window.AUTH_PERFIL&&window.AUTH_PERFIL.nombre)||'—',
    estado:'pendiente'
  };
  try{
    if(!(window.DB&&window.DB.saveTarea)) throw new Error('DB no disponible');
    var r=await window.DB.saveTarea(payload);
    if(r.error) throw r.error;
    window._tareas.unshift(r.data||payload);
    toggleNuevaTarea();
    renderTareas();
    _tToast('Tarea creada y asignada a '+asigNombre);
  }catch(e){ alert('Error: '+(e.message||e)); }
}
async function loadTareas(){
  try{
    if(window.DB && window.DB.getTareas){
      var r=await window.DB.getTareas(FINCA_TAREAS);
      if(r && !r.error && Array.isArray(r.data)) window._tareas=r.data;
    }
  }catch(e){}
  renderTareas();
}
function renderTareas(){
  var cont=document.getElementById('tareas-list'); if(!cont) return;
  var area=document.getElementById('tf-area').value;
  var estado=document.getElementById('tf-estado').value;
  var rango=document.getElementById('tf-rango').value;
  var hoyISO=new Date().toISOString().slice(0,10);
  var fs=new Date(); fs.setDate(fs.getDate()+7); var finSemISO=fs.toISOString().slice(0,10);
  var list=(window._tareas||[]).filter(function(t){
    if(area && t.area!==area) return false;
    if(estado && t.estado!==estado) return false;
    if(rango==='semana' && !(t.fecha_vencimiento>=hoyISO && t.fecha_vencimiento<=finSemISO)) return false;
    if(rango==='vencidas' && !(t.fecha_vencimiento<hoyISO && t.estado!=='finalizada')) return false;
    return true;
  });
  if(!list.length){ cont.innerHTML='<div class="empty" style="padding:24px;text-align:center;color:var(--text3)">Sin tareas para este filtro.</div>'; return; }
  cont.innerHTML=list.map(tareaCard).join('');
}
function tareaCard(t){
  var prio={urgente:{l:'🔴 URGENTE',c:'var(--red)'},alta:{l:'🟠 ALTA',c:'var(--orange)'},normal:{l:'NORMAL',c:'var(--text3)'},baja:{l:'BAJA',c:'var(--text4)'}}[t.prioridad]||{l:_tEsc(t.prioridad),c:'var(--text3)'};
  var done=t.estado==='finalizada';
  var estadoTxt = done?' · <span style="color:var(--green)">✓ Finalizada</span>':(t.estado==='en_progreso'?' · <span style="color:var(--sky)">En progreso</span>':'');
  return '<div style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;background:var(--bg2);'+(done?'opacity:.6;':'')+'">'
    +'<div style="font-size:11px;font-weight:700;color:'+prio.c+'">'+prio.l+' · '+_tEsc(AREA_LBL[t.area]||t.area)+estadoTxt+'</div>'
    +'<div style="font-size:14px;font-weight:600;margin:4px 0;color:var(--text)">'+_tEsc(t.titulo)+'</div>'
    +(t.descripcion?'<div style="font-size:12px;color:var(--text2);margin-bottom:4px">'+_tEsc(t.descripcion)+'</div>':'')
    +'<div style="font-size:12px;color:var(--text3)">para: '+_tEsc(t.asignado_nombre||'—')+' · hasta: '+_fmtTarea(t.fecha_vencimiento)+'</div>'
    +(t.comentario_finalizacion?'<div style="font-size:11px;color:var(--text3);margin-top:4px">💬 '+_tEsc(t.comentario_finalizacion)+'</div>':'')
    +(done?'':'<div style="display:flex;gap:8px;margin-top:10px">'
      +(t.estado!=='en_progreso'?'<button class="btn" onclick="marcarProgreso(\''+t.id+'\')">Marcar en progreso</button>':'')
      +'<button class="btn primary" onclick="finalizarTarea(\''+t.id+'\')">Finalizar</button></div>')
    +'</div>';
}
async function marcarProgreso(id){
  try{ var r=await window.DB.updateTarea(id,{estado:'en_progreso'}); if(r.error) throw r.error;
    var t=(window._tareas||[]).find(function(x){return x.id===id;}); if(t) t.estado='en_progreso';
    renderTareas(); _tToast('Tarea en progreso');
  }catch(e){ alert('Error: '+(e.message||e)); }
}
async function finalizarTarea(id){
  var comentario=prompt('Comentario de finalización (opcional):','');
  if(comentario===null) return; // cancelado
  try{
    var r=await window.DB.updateTarea(id,{ estado:'finalizada', fecha_finalizacion:new Date().toISOString(), comentario_finalizacion:(comentario||'').trim()||null });
    if(r.error) throw r.error;
    var t=(window._tareas||[]).find(function(x){return x.id===id;});
    if(t){ t.estado='finalizada'; t.comentario_finalizacion=(comentario||'').trim()||null; }
    renderTareas(); _tToast('Tarea finalizada');
  }catch(e){ alert('Error: '+(e.message||e)); }
}
</script>
</body>
</html>
