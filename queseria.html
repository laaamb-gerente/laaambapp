<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#00AFB6;--teal-d:#008a90;--teal-bg:rgba(0,175,182,.10);--teal-bg2:rgba(0,175,182,.06);
  --wine:#9C3F66;--wine-bg:rgba(156,63,102,.12);--orange:#F18F22;--orange-bg:rgba(241,143,34,.12);
  --bg:#080f10;--bg2:#0c1517;--bg3:#101d1f;--bg4:#152224;--surface:#172628;--surface2:#1d3235;
  --border:rgba(0,175,182,.10);--border2:rgba(0,175,182,.20);--border3:rgba(0,175,182,.35);
  --green:#2ec77a;--green-bg:rgba(46,199,122,.10);--red:#e05252;--red-bg:rgba(224,82,82,.10);
  --amber:#e8a030;--amber-bg:rgba(232,160,48,.10);--sky:#38b0d8;--sky-bg:rgba(56,176,216,.10);
  --text:#d8edef;--text2:#7eadb2;--text3:#3d6e74;--text4:#1e3f44;
  --r:8px;--r2:14px;--sidebar:236px;--anim:.16s cubic-bezier(.4,0,.2,1)}
html[data-theme="light"]{--teal:#00AFB6;--teal-d:#008a90;--teal-bg:rgba(0,175,182,.10);--teal-bg2:rgba(0,175,182,.05);--wine:#9C3F66;--wine-bg:rgba(156,63,102,.10);--orange:#F18F22;--orange-bg:rgba(241,143,34,.10);--bg:#F8F9FA;--bg2:#FFFFFF;--bg3:#F3F4F6;--bg4:#FAFAFA;--surface:#FFFFFF;--surface2:#F3F4F6;--border:#E5E7EB;--border2:#D1D5DB;--border3:#9CA3AF;--green:#10B981;--green-bg:rgba(16,185,129,.10);--red:#EF4444;--red-bg:rgba(239,68,68,.10);--amber:#F59E0B;--amber-bg:rgba(245,158,11,.10);--sky:#38B0D8;--sky-bg:rgba(56,176,216,.10);--text:#1A1A2E;--text2:#6B7280;--text3:#9CA3AF;--text4:#C4C9D4}
html[data-theme="dark"]{--teal:#00AFB6;--teal-d:#008a90;--teal-bg:rgba(0,175,182,.12);--teal-bg2:rgba(0,175,182,.06);--wine:#9C3F66;--wine-bg:rgba(156,63,102,.15);--orange:#F18F22;--orange-bg:rgba(241,143,34,.15);--bg:#0F172A;--bg2:#1E293B;--bg3:#1E293B;--bg4:#162032;--surface:#1E293B;--surface2:#162032;--border:#334155;--border2:#3E4C61;--border3:#475569;--green:#10B981;--green-bg:rgba(16,185,129,.14);--red:#EF4444;--red-bg:rgba(239,68,68,.14);--amber:#F59E0B;--amber-bg:rgba(245,158,11,.14);--sky:#38B0D8;--sky-bg:rgba(56,176,216,.14);--text:#F1F5F9;--text2:#94A3B8;--text3:#64748B;--text4:#475569}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Changa',sans-serif;font-size:14px;line-height:1.5;overflow:hidden}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:2px}
.app{display:flex;height:100vh;width:100vw}
.sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:10;flex-shrink:0}
.sidebar::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--teal),transparent);opacity:.5}
.sb-head{padding:20px 16px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-bottom:4px}.sb-logo-img{height:40px;width:40px;border-radius:9px;flex-shrink:0}
.sb-logo-text{font-family:'Sigmar',cursive;font-size:17px;letter-spacing:.5px;color:var(--teal)}
.sb-logo-sub{font-size:9px;font-weight:600;color:var(--teal-d);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px}
.nav-scroll{flex:1;overflow-y:auto;padding:8px 0}
.nav-group{padding:14px 14px 4px;font-size:9px;font-weight:700;color:var(--text4);letter-spacing:1.2px;text-transform:uppercase}
.nav-link{display:flex;align-items:center;gap:9px;padding:8px 10px;margin:1px 8px;border-radius:var(--r);cursor:pointer;color:var(--text2);font-size:13px;text-decoration:none;transition:all var(--anim);position:relative}
.nav-link:hover{background:var(--surface);color:var(--text)}
.nav-link.active{background:var(--teal-bg);color:var(--teal);border:1px solid var(--border2)}
.nav-link.active::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:2px;background:var(--teal);border-radius:2px}
.nav-ico{width:15px;height:15px;flex-shrink:0;opacity:.6}.nav-link.active .nav-ico,.nav-link:hover .nav-ico{opacity:1}
.nav-badge{margin-left:auto;font-size:10px;font-weight:600;background:var(--surface2);color:var(--teal);padding:1px 7px;border-radius:10px;border:1px solid var(--border2)}
.sb-foot{flex-shrink:0;padding:12px;border-top:1px solid var(--border);background:var(--bg2)}

.avatar{width:30px;height:30px;border-radius:50%;background:var(--teal-bg);border:1.5px solid var(--teal-d);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--teal);flex-shrink:0}

#lham{display:none;position:fixed;top:12px;left:12px;z-index:9999;background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--r);width:46px;height:46px;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 16px rgba(0,0,0,.45)}

.ph-eyebrow{font-size:10px;font-weight:700;color:var(--teal-d);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px}
.ph-title{font-family:'Sigmar',cursive;font-size:30px;color:var(--text);line-height:1.1}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbadge{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--border2);background:var(--surface2);color:var(--text2)}
.tbadge .n{font-family:'Sigmar',cursive;font-size:15px;line-height:1;color:var(--teal)}
.sec{margin-bottom:22px}
.sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-title .dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.empty-box{padding:22px;text-align:center;color:var(--text3);font-size:13px;background:var(--bg2);border:1px dashed var(--border2);border-radius:var(--r2);line-height:1.6}
/* ── KPIs ── */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:16px}
.kpi .v{font-family:'Sigmar',cursive;font-size:24px;color:var(--teal);line-height:1}
.kpi .k{font-size:11px;color:var(--text3);margin-top:4px}
.kpi.empty .v{color:var(--text3);font-size:14px;font-family:'Changa',sans-serif}
/* ── LOTE CARDS ── */
.lote-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.lote-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:16px}
.lote-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.lote-tipo{font-size:15px;font-weight:700;color:var(--text);text-transform:capitalize}
.lote-fecha{font-size:11px;color:var(--text3);margin-top:1px}
.lote-mad{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--text2);white-space:nowrap}
.lote-flow{margin-top:10px;font-size:14px;color:var(--text);font-weight:600}
.lote-flow b{color:var(--teal)}
.lote-rend{margin-top:6px;font-size:13px;font-weight:700}
.rend-g{color:var(--green)}.rend-a{color:var(--amber)}.rend-r{color:var(--red)}
.lote-cmp{font-size:11px;margin-top:3px}
.cmp-good{color:var(--green)}.cmp-bad{color:var(--amber)}
.lote-cost{margin-top:8px;font-size:12px;color:var(--text2);border-top:1px solid var(--border);padding-top:8px}
.lote-cost b{color:var(--text)}
.lote-cost .pend{color:var(--text3);font-style:italic}
.lote-btn{margin-top:12px;width:100%;background:transparent;border:1px solid var(--border2);color:var(--text2);font-weight:600;border-radius:10px;padding:9px;font-family:inherit;font-size:13px;cursor:pointer}
.lote-btn:hover{border-color:var(--teal);color:var(--teal)}
/* ── BUTTONS / MODAL / TOAST ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 14px;border-radius:var(--r);font-family:'Changa',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all var(--anim);text-decoration:none}
.btn-primary{background:var(--teal);color:#fff}.btn-primary:hover{background:#1cc8d0}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}.btn-ghost:hover{background:var(--surface);color:var(--teal)}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9000;align-items:center;justify-content:center;padding:16px}
.modal-ov.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);width:100%;max-width:460px;max-height:92vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.5)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-h h3{font-family:'Sigmar',cursive;font-size:17px;color:var(--text)}
.modal-x{background:transparent;border:none;color:var(--text3);font-size:22px;cursor:pointer;line-height:1}
.modal-b{padding:20px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;color:var(--text);font-family:inherit;font-size:14px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--teal)}
.fld textarea{resize:vertical;min-height:54px}
.fld-row{display:flex;gap:10px}.fld-row .fld{flex:1}
.calc-box{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:12px;margin-bottom:14px}
.calc-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.calc-row:last-child{margin-bottom:0}.calc-row span{color:var(--text3)}.calc-row b{color:var(--text);font-weight:700}
.comp-toggle{width:100%;text-align:left;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;color:var(--text2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:12px}
.comp-body{display:none}.comp-body.on{display:block}
.modal-msg{font-size:12px;margin-top:8px;min-height:16px}
.modal-msg.ok{color:var(--green)}.modal-msg.err{color:var(--red)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:10000;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#toast.on{opacity:1}#toast.err{background:var(--red);color:#fff}
@media(max-width:768px){
  #lham{display:flex}
  #sidebar{position:fixed!important;top:0;left:0;height:100vh;transform:translateX(-100%);z-index:9995;transition:transform .28s ease}
  #sidebar.on{transform:translateX(0)}
  .main{padding:12px;padding-top:64px}
  .lote-grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr}
  .ph-title{font-size:25px}
  .btn{min-height:44px}
  .fld input,.fld select,.fld textarea{font-size:16px}
  .modal-ov{padding:0;align-items:flex-end}
  .modal{max-width:100%;width:100%;border-radius:18px 18px 0 0;max-height:92vh}
}
</style>

<script>
// ═══════════════════════════════════════════════════════════════════
//  QUESERÍA — pantalla móvil (Fase 5). Solo métodos de db.js.
//  Gating UI: crear/editar solo gerente/administrador/veterinario.
// ═══════════════════════════════════════════════════════════════════
(function(){
  'use strict';
  var DB = window.DB;
  var FINCA = 'a1b2c3d4-0000-0000-0000-000000000001';
  var TIPOS = { fresco:'Fresco', semicurado:'Semicurado', curado:'Curado', manchego:'Manchego', otro:'Otro' };
  var lotes = [];
  var loteMap = {};
  var compReciente = null;   // { grasa_pct, caseina_pct } para rendimiento teórico

  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function num(n,d){ d=(d==null?1:d); var f=Math.pow(10,d); return (Math.round((+n||0)*f)/f).toLocaleString('es-CO',{minimumFractionDigits:0,maximumFractionDigits:d}); }
  function cop(n){ return '$'+Math.round(+n||0).toLocaleString('es-CO'); }
  function miPerfilId(){ return (window.AUTH_PERFIL && window.AUTH_PERFIL.id) || null; }
  function esCreador(){ var r=window.AUTH_ROL; return r==='gerente'||r==='administrador'||r==='admin'||r==='veterinario'; }
  function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function mesActual(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
  function toast(msg, err){ var t=document.getElementById('toast'); t.textContent=msg; t.className=err?'on err':'on'; clearTimeout(t._tm); t._tm=setTimeout(function(){ t.className=''; }, 2600); }
  function rendCls(r){ return r<4.5?'rend-g':(r<=6?'rend-a':'rend-r'); }

  async function cargar(){
    if(esCreador()) document.getElementById('btn-nuevo').style.display='';
    var r = await DB.getQuesosLotes(50);
    lotes = (r && r.data) || [];
    loteMap = {}; lotes.forEach(function(l){ loteMap[l.id]=l; });
    renderBadges();
    renderKpis();
    renderLotes();
  }

  function renderBadges(){
    var corte = Date.now() - 30*86400000;
    var last30 = lotes.filter(function(l){ return new Date(l.fecha).getTime() >= corte; });
    var kg = last30.reduce(function(s,l){ return s+(Number(l.queso_kg)||0); }, 0);
    var rends = last30.map(function(l){ return Number(l.rendimiento_l_por_kg); }).filter(function(v){ return !isNaN(v) && v>0; });
    var rendProm = rends.length ? rends.reduce(function(a,b){return a+b;},0)/rends.length : null;
    document.getElementById('b-kg').textContent = num(kg,1);
    document.getElementById('b-rend').textContent = rendProm!=null ? num(rendProm,2) : '—';
  }

  function renderKpis(){
    var mes = mesActual();
    var delMes = lotes.filter(function(l){ return String(l.fecha||'').slice(0,7)===mes; });
    var cont = document.getElementById('kpis');
    if(!delMes.length){
      cont.innerHTML = '<div class="kpi empty" style="grid-column:1/-1"><div class="v">Sin lotes registrados este mes</div></div>';
      return;
    }
    var leche = delMes.reduce(function(s,l){ return s+(Number(l.leche_usada_l)||0); }, 0);
    var kg = delMes.reduce(function(s,l){ return s+(Number(l.queso_kg)||0); }, 0);
    var margen = delMes.reduce(function(s,l){ return s+((Number(l.ingreso_total)||0)-(Number(l.costo_total)||0)); }, 0);
    cont.innerHTML =
        '<div class="kpi"><div class="v">'+num(leche,1)+'</div><div class="k">Leche procesada (L)</div></div>'
      + '<div class="kpi"><div class="v">'+num(kg,1)+'</div><div class="k">Queso producido (kg)</div></div>'
      + '<div class="kpi"><div class="v">'+cop(margen)+'</div><div class="k">Margen bruto (COP)</div></div>';
  }

  function renderLotes(){
    var cont=document.getElementById('lote-list');
    var empty=document.getElementById('lote-empty');
    if(!lotes.length){
      cont.innerHTML='';
      empty.innerHTML='<div class="empty-box">No hay lotes de queso registrados.<br>Registra el primer lote con el botón ＋.</div>';
      return;
    }
    empty.innerHTML='';
    cont.innerHTML = lotes.map(function(l){
      var tipo = TIPOS[l.tipo_queso] || (l.tipo_queso||'Otro');
      var real = Number(l.rendimiento_l_por_kg) || ((Number(l.queso_kg)>0) ? (Number(l.leche_usada_l)/Number(l.queso_kg)) : 0);
      var teo = l.rendimiento_teorico_l_por_kg!=null ? Number(l.rendimiento_teorico_l_por_kg) : null;
      var cmp='';
      if(teo!=null && real>0){
        if(real < teo) cmp='<div class="lote-cmp cmp-good">✅ Mejor que esperado (teórico: '+num(teo,2)+' L/kg)</div>';
        else if(real > teo*1.05) cmp='<div class="lote-cmp cmp-bad">⚠️ Por debajo del esperado (teórico: '+num(teo,2)+' L/kg)</div>';
      }
      var costo = Number(l.costo_total)||0;
      var costoBlock;
      if(costo>0){
        var cxk = Number(l.queso_kg)>0 ? costo/Number(l.queso_kg) : 0;
        var margen = (Number(l.ingreso_total)||0) - costo;
        costoBlock = 'Costo: <b>'+cop(costo)+'</b>'
          + (l.precio_venta_kg!=null ? (' · Precio: <b>'+cop(l.precio_venta_kg)+'/kg</b>') : '')
          + '<br>Costo/kg: <b>'+cop(cxk)+'</b>'
          + (l.precio_venta_kg!=null ? (' · Margen: <b>'+cop(margen)+'</b>') : '');
      } else {
        costoBlock = '<span class="pend">Costeo pendiente</span>';
      }
      return '<div class="lote-card">'
        + '<div class="lote-top"><div><div class="lote-tipo">🧀 '+esc(tipo)+'</div>'
        +   '<div class="lote-fecha">'+esc(l.fecha)+'</div></div>'
        +   '<span class="lote-mad">'+(Number(l.maduracion_dias)||0)+' d madurac.</span></div>'
        + '<div class="lote-flow"><b>'+num(l.leche_usada_l,1)+' L</b> → <b>'+num(l.queso_kg,2)+' kg</b></div>'
        + '<div class="lote-rend '+rendCls(real)+'">Rendimiento: '+num(real,2)+' L/kg</div>'
        + cmp
        + '<div class="lote-cost">'+costoBlock+'</div>'
        + '<div style="display:flex;gap:6px;margin-top:12px">'
        +   '<button class="lote-btn" style="margin-top:0" onclick="abrirDetalle(\''+l.id+'\')">'+(esCreador()?'Detalle':'Ver')+'</button>'
        +   '<button class="lote-btn" style="margin-top:0;flex:0 0 auto;width:auto;padding:9px 12px" onclick="mostrarQRQueso(\''+l.id+'\')">🔗 QR</button>'
        + '</div>'
        + ((l.precio_venta_kg!=null && Number(l.queso_kg)>0)
            ? '<button class="lote-btn" style="border-color:var(--green);color:var(--green)" onclick="registrarVentaQueso(\''+l.id+'\')">📒 Registrar venta</button>'
            : '')
        + '</div>';
    }).join('');
  }

  // ── Composición promedio reciente (últimos 15 días) para rendimiento teórico ──
  async function compPromedioReciente(){
    try{
      var r = await DB.getLactancias(true);
      var lacts = (r && r.data) || [];
      var corte = Date.now() - 15*86400000;
      var gs=[], cs=[];
      lacts.forEach(function(l){
        (l.controles||[]).forEach(function(c){
          if(new Date(c.fecha).getTime() >= corte){
            if(c.grasa_pct!=null) gs.push(Number(c.grasa_pct));
            if(c.caseina_pct!=null) cs.push(Number(c.caseina_pct));
          }
        });
      });
      return {
        grasa_pct: gs.length ? gs.reduce(function(a,b){return a+b;},0)/gs.length : null,
        caseina_pct: cs.length ? cs.reduce(function(a,b){return a+b;},0)/cs.length : null
      };
    }catch(e){ return {}; }
  }

  // ── MODALES ──
  function abrirModal(titulo, html){
    document.getElementById('modal-title').textContent=titulo;
    document.getElementById('modal-body').innerHTML=html;
    document.getElementById('modal-ov').classList.add('on');
  }
  function cerrarModal(){ document.getElementById('modal-ov').classList.remove('on'); }

  async function abrirNuevoLote(){
    if(!esCreador()){ toast('No tienes permiso para crear lotes', true); return; }
    var html=''
      + '<div class="fld"><label>Fecha</label><input type="date" id="q-fecha" value="'+hoyISO()+'"></div>'
      + '<div class="fld"><label>Tipo de queso</label><select id="q-tipo" onchange="onTipoChange()">'
      +   '<option value="fresco">Fresco</option><option value="semicurado">Semicurado</option>'
      +   '<option value="curado">Curado</option><option value="manchego">Manchego</option>'
      +   '<option value="otro">Otro</option></select></div>'
      + '<div class="fld" id="q-otro-wrap" style="display:none"><label>Especificar tipo</label><input type="text" id="q-otro" placeholder="Nombre del queso"></div>'
      + '<div class="fld-row">'
      +   '<div class="fld"><label>Litros de leche</label><input type="number" id="q-leche" min="0" step="0.1" oninput="calcLote()" placeholder="Ej. 100"></div>'
      +   '<div class="fld"><label>kg de queso</label><input type="number" id="q-kg" min="0" step="0.001" oninput="calcLote()" placeholder="Ej. 18.5"></div>'
      + '</div>'
      + '<div class="fld"><label>Días de maduración</label><input type="number" id="q-mad" min="0" step="1" value="0"></div>'
      + '<button class="comp-toggle" id="q-toggle" onclick="toggleCosteo()">▸ Costeo (opcional)</button>'
      + '<div class="comp-body" id="q-costeo">'
      +   '<div class="fld-row"><div class="fld"><label>Costo leche (COP)</label><input type="number" id="q-cleche" min="0" step="1" oninput="calcLote()"></div>'
      +   '<div class="fld"><label>Costo insumos (COP)</label><input type="number" id="q-cins" min="0" step="1" oninput="calcLote()"></div></div>'
      +   '<div class="fld-row"><div class="fld"><label>Mano de obra (COP)</label><input type="number" id="q-cmo" min="0" step="1" oninput="calcLote()"></div>'
      +   '<div class="fld"><label>Precio venta (COP/kg)</label><input type="number" id="q-precio" min="0" step="1" oninput="calcLote()"></div></div>'
      + '</div>'
      + '<div class="calc-box" id="q-calc"></div>'
      + '<div class="fld"><label>Observación (opcional)</label><textarea id="q-notas"></textarea></div>'
      + '<div class="modal-msg" id="q-msg"></div>'
      + '<button class="btn btn-primary" style="width:100%" id="q-save" onclick="guardarLote()">Guardar lote</button>';
    abrirModal('Nuevo lote de queso', html);
    // Cargar composición reciente para el rendimiento teórico
    compReciente = await compPromedioReciente();
    calcLote();
  }
  function onTipoChange(){
    var v=document.getElementById('q-tipo').value;
    document.getElementById('q-otro-wrap').style.display = v==='otro' ? '' : 'none';
  }
  function toggleCosteo(){
    var b=document.getElementById('q-costeo'); var t=document.getElementById('q-toggle');
    b.classList.toggle('on');
    t.textContent=(b.classList.contains('on')?'▾':'▸')+' Costeo (opcional)';
  }
  function nOr0(id){ var v=parseFloat((document.getElementById(id)||{}).value); return isNaN(v)?0:v; }
  function nOrNull(id){ var v=parseFloat((document.getElementById(id)||{}).value); return isNaN(v)?null:v; }
  async function calcLote(){
    var leche=nOr0('q-leche'), kg=nOr0('q-kg');
    var box=document.getElementById('q-calc'); if(!box) return;
    var rows='';
    if(leche>0 && kg>0){
      var real = leche/kg;
      var cls = rendCls(real);
      rows += '<div class="calc-row"><span>Rendimiento real</span><b class="'+cls+'">'+num(real,2)+' L/kg</b></div>';
    }
    var costo = nOr0('q-cleche')+nOr0('q-cins')+nOr0('q-cmo');
    if(costo>0 && kg>0){
      var cxk = costo/kg;
      rows += '<div class="calc-row"><span>Costo por kg</span><b>'+cop(cxk)+'</b></div>';
      var precio=nOr0('q-precio');
      if(precio>0) rows += '<div class="calc-row"><span>Margen por kg</span><b>'+cop(precio-cxk)+'</b></div>';
    }
    // Rendimiento teórico (de composición reciente)
    var teoObj = await DB.calcularRendimientoTeorico(leche, compReciente||{});
    if(teoObj){
      rows += '<div class="calc-row"><span>Rendimiento teórico'+(teoObj.fuente==='referencia'?' (ref.)':'')+'</span><b>'+num(teoObj.rendimiento_l_kg,2)+' L/kg</b></div>';
    }
    box.innerHTML = rows || '<div class="calc-row"><span>Ingresa litros y kg para ver el rendimiento</span></div>';
  }
  async function guardarLote(){
    var tipo=document.getElementById('q-tipo').value;
    if(tipo==='otro'){ var o=(document.getElementById('q-otro').value||'').trim(); if(o) tipo=o; }
    var leche=nOrNull('q-leche'), kg=nOrNull('q-kg');
    var msg=document.getElementById('q-msg');
    if(leche==null||leche<=0){ msg.className='modal-msg err'; msg.textContent='Indica los litros de leche.'; return; }
    if(kg==null||kg<=0){ msg.className='modal-msg err'; msg.textContent='Indica los kg de queso.'; return; }
    var btn=document.getElementById('q-save'); btn.disabled=true; btn.textContent='Guardando…';
    var teoObj = await DB.calcularRendimientoTeorico(leche, compReciente||{});
    try{
      var res = await DB.createQuesoLote({
        fecha: document.getElementById('q-fecha').value || hoyISO(),
        tipo_queso: tipo, leche_usada_l: leche, queso_kg: kg,
        maduracion_dias: parseInt(document.getElementById('q-mad').value,10) || 0,
        costo_leche: nOrNull('q-cleche'), costo_insumos: nOrNull('q-cins'),
        costo_mano_obra: nOrNull('q-cmo'), precio_venta_kg: nOrNull('q-precio'),
        rendimiento_teorico_l_por_kg: teoObj ? teoObj.rendimiento_l_kg : null,
        responsable: miPerfilId(),
        notas: document.getElementById('q-notas').value || null,
        finca_id: FINCA
      });
      if(res.error) throw res.error;
      cerrarModal(); toast('Lote registrado ✓'); await cargar();
    }catch(e){ btn.disabled=false; btn.textContent='Guardar lote'; msg.className='modal-msg err'; msg.textContent='Error al guardar.'; }
  }

  // Detalle / edición (costeo, precio, maduración, notas)
  function abrirDetalle(id){
    var l=loteMap[id]; if(!l) return;
    var editable = esCreador();
    var dis = editable ? '' : ' disabled';
    var real = Number(l.rendimiento_l_por_kg) || 0;
    var teo = l.rendimiento_teorico_l_por_kg;
    var html=''
      + '<div class="calc-box">'
      +   '<div class="calc-row"><span>'+esc(TIPOS[l.tipo_queso]||l.tipo_queso)+' · '+esc(l.fecha)+'</span><b>'+num(l.leche_usada_l,1)+' L → '+num(l.queso_kg,2)+' kg</b></div>'
      +   '<div class="calc-row"><span>Rendimiento real</span><b class="'+rendCls(real)+'">'+num(real,2)+' L/kg</b></div>'
      +   (teo!=null?('<div class="calc-row"><span>Rendimiento teórico</span><b>'+num(teo,2)+' L/kg</b></div>'):'')
      + '</div>'
      + '<div class="fld"><label>Días de maduración</label><input type="number" id="d-mad" min="0" step="1" value="'+(Number(l.maduracion_dias)||0)+'"'+dis+'></div>'
      + '<div class="fld-row"><div class="fld"><label>Costo leche</label><input type="number" id="d-cleche" min="0" step="1" value="'+(l.costo_leche!=null?l.costo_leche:'')+'"'+dis+'></div>'
      +   '<div class="fld"><label>Costo insumos</label><input type="number" id="d-cins" min="0" step="1" value="'+(l.costo_insumos!=null?l.costo_insumos:'')+'"'+dis+'></div></div>'
      + '<div class="fld-row"><div class="fld"><label>Mano de obra</label><input type="number" id="d-cmo" min="0" step="1" value="'+(l.costo_mano_obra!=null?l.costo_mano_obra:'')+'"'+dis+'></div>'
      +   '<div class="fld"><label>Precio venta (COP/kg)</label><input type="number" id="d-precio" min="0" step="1" value="'+(l.precio_venta_kg!=null?l.precio_venta_kg:'')+'"'+dis+'></div></div>'
      + '<div class="fld"><label>Notas</label><textarea id="d-notas"'+dis+'>'+esc(l.notas||'')+'</textarea></div>'
      + '<div class="modal-msg" id="d-msg"></div>'
      + (editable ? '<button class="btn btn-primary" style="width:100%" id="d-save" onclick="guardarDetalle(\''+id+'\')">Guardar cambios</button>' : '');
    abrirModal('Detalle del lote', html);
  }
  async function guardarDetalle(id){
    var btn=document.getElementById('d-save'); btn.disabled=true; btn.textContent='Guardando…';
    try{
      var res = await DB.updateQuesoLote(id, {
        maduracion_dias: parseInt(document.getElementById('d-mad').value,10) || 0,
        costo_leche: nOrNull('d-cleche'), costo_insumos: nOrNull('d-cins'),
        costo_mano_obra: nOrNull('d-cmo'), precio_venta_kg: nOrNull('d-precio'),
        notas: document.getElementById('d-notas').value || null
      });
      if(res.error) throw res.error;
      cerrarModal(); toast('Cambios guardados ✓'); await cargar();
    }catch(e){ btn.disabled=false; btn.textContent='Guardar cambios'; var m=document.getElementById('d-msg'); m.className='modal-msg err'; m.textContent='Error al guardar.'; }
  }

  // ── QR de trazabilidad del lote ──
  function mostrarQRQueso(id){
    var url = 'https://laaambapp.vercel.app/qr-queso.html?id='+id;
    var html =
        '<div style="text-align:center;font-size:13px;color:var(--text2);margin-bottom:12px">Escanea para ver trazabilidad</div>'
      + '<div id="qr-box" style="display:flex;justify-content:center;background:#fff;border-radius:12px;padding:14px;margin-bottom:12px"></div>'
      + '<div style="font-size:11px;color:var(--text3);word-break:break-all;background:var(--bg3);border-radius:8px;padding:9px 11px;margin-bottom:12px" id="qr-url">'+esc(url)+'</div>'
      + '<div style="display:flex;gap:8px">'
      +   '<button class="btn btn-ghost" style="flex:1" onclick="copiarQR(\''+id+'\')">Copiar enlace</button>'
      +   '<button class="btn btn-primary" style="flex:1" onclick="compartirQR(\''+id+'\')">Compartir</button>'
      + '</div>';
    abrirModal('QR de trazabilidad', html);
    var box = document.getElementById('qr-box');
    if(box && window.QRCode){ new QRCode(box, { text:url, width:200, height:200, colorDark:'#0c1517', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.H }); }
    else if(box){ box.innerHTML = '<div style="color:#333;font-size:12px;padding:20px">No se pudo generar el QR. Usa el enlace.</div>'; }
  }
  function _qrUrl(id){ return 'https://laaambapp.vercel.app/qr-queso.html?id='+id; }
  function copiarQR(id){
    var url=_qrUrl(id);
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){ toast('Enlace copiado'); }).catch(function(){ toast('Copia manual: '+url); }); }
    else { toast('Copia manual del enlace'); }
  }
  function compartirQR(id){
    var url=_qrUrl(id);
    if(navigator.share){ navigator.share({ title:'Trazabilidad LAAAMB', text:'Trazabilidad del queso LAAAMB', url:url }).catch(function(){}); }
    else { copiarQR(id); }
  }
  // ── Registrar venta en Finanzas (integración ligera) ──
  function registrarVentaQueso(id){
    var l = loteMap[id]; if(!l) return;
    var ingreso = (Number(l.ingreso_total)||0) || (Number(l.queso_kg)*Number(l.precio_venta_kg||0));
    var tipo = (TIPOS[l.tipo_queso]||l.tipo_queso||'queso');
    // finanzas.html no lee parámetros de URL → avisamos el monto y abrimos Finanzas.
    toast('Registra la venta en Finanzas: '+cop(ingreso));
    var desc = encodeURIComponent('Queso '+tipo+' '+(l.fecha||''));
    setTimeout(function(){
      window.location.href = 'finanzas.html?tipo=ingreso&categoria=L%C3%A1cteos&descripcion='+desc+'&monto='+Math.round(ingreso);
    }, 900);
  }

  // Exponer
  window.mostrarQRQueso=mostrarQRQueso;
  window.copiarQR=copiarQR;
  window.compartirQR=compartirQR;
  window.registrarVentaQueso=registrarVentaQueso;
  window.abrirNuevoLote=abrirNuevoLote;
  window.onTipoChange=onTipoChange;
  window.toggleCosteo=toggleCosteo;
  window.calcLote=calcLote;
  window.guardarLote=guardarLote;
  window.abrirDetalle=abrirDetalle;
  window.guardarDetalle=guardarDetalle;
  window.cerrarModal=cerrarModal;
  window.recargarQueseria=cargar;

  function whenReady(cb){
    if(window.AUTH_ROL){ cb(); return; }
    var n=0; var iv=setInterval(function(){ if(window.AUTH_ROL||n>50){ clearInterval(iv); cb(); } n++; }, 100);
  }
  document.addEventListener('DOMContentLoaded', function(){ whenReady(cargar); });
})();
</script>
