<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00AFB6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LAAAMB">
<link rel="apple-touch-icon" href="icons/icon-laaamb.jpg">
  <meta name="msapplication-TileImage" content="icons/icon-laaamb.jpg">
<title>LAAAMB · Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Sigmar&family=Changa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Supabase JS SDK -->
<!-- Sentry: monitoreo de errores -->
<script
  src="https://js.sentry-cdn.com/16a09522e75d0a3fe4cec3bb077c1c32.min.js"
  crossorigin="anonymous"
></script>
<script src="js/error-handler.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
  // Cliente Supabase global (página pública — NO incluye auth.js).
  // detectSessionInUrl:false → manejamos el token de invitación manualmente
  // (si no, el SDK consume el hash y redirige antes de pedir la contraseña).
  window._sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
    auth: { detectSessionInUrl: false, persistSession: true, autoRefreshToken: true }
  });
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#00AFB6;--teal-d:#008a90;--teal-bg:rgba(0,175,182,.10);
  --wine:#9C3F66;--orange:#F18F22;
  --bg:#0d1117;--card:#161b22;
  --border:rgba(0,175,182,.16);--border2:rgba(0,175,182,.30);
  --text:#e6edf3;--text2:#9aa7b2;--text3:#6b7681;
  --red:#e05252;--green:#2ec77a;
}
html,body{height:100%}
body{
  font-family:'Changa',system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background-image:radial-gradient(circle at 20% 20%,rgba(0,175,182,.07),transparent 45%),
    radial-gradient(circle at 80% 80%,rgba(156,63,102,.06),transparent 45%);
}
.login-card{
  width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);
  border-radius:18px;padding:38px 32px;box-shadow:0 24px 60px rgba(0,0,0,.45);
}
.logo{text-align:center;margin-bottom:6px}
.logo-text{font-family:'Sigmar',cursive;font-size:34px;letter-spacing:1px;color:var(--teal);line-height:1}
.logo-sub{font-size:10px;font-weight:700;color:var(--teal-d);letter-spacing:2px;text-transform:uppercase;margin-top:6px}
.title{text-align:center;font-size:14px;font-weight:600;color:var(--text);margin-top:22px}
.subtitle{text-align:center;font-size:12px;color:var(--text2);margin-top:4px;margin-bottom:26px}
.field{margin-bottom:16px}
label{display:block;font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.4px;text-transform:uppercase;margin-bottom:7px}
input[type=email],input[type=password],input[type=text].pw{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;
  padding:13px 14px;font-family:inherit;font-size:14px;color:var(--text);transition:border-color .15s,box-shadow .15s;
}
input[type=email]:focus,input[type=password]:focus,input[type=text].pw:focus{outline:none;border-color:var(--border2);box-shadow:0 0 0 3px var(--teal-bg)}
input::placeholder{color:var(--text3)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-eye{
  position:absolute;top:50%;right:8px;transform:translateY(-50%);
  background:transparent;border:none;color:var(--text3);cursor:pointer;
  padding:6px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:color .15s;
}
.pw-eye:hover{color:var(--teal)}
.btn{
  width:100%;margin-top:6px;background:var(--teal);color:#04181a;border:none;border-radius:10px;
  padding:13px;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.3px;cursor:pointer;
  transition:filter .15s,transform .05s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:not-allowed;filter:none}
.msg{margin-top:18px;font-size:12.5px;line-height:1.5;padding:12px 14px;border-radius:10px;display:none}
.msg.ok{display:block;background:rgba(46,199,122,.08);border:1px solid rgba(46,199,122,.3);color:var(--green)}
.msg.err{display:block;background:rgba(224,82,82,.08);border:1px solid rgba(224,82,82,.3);color:var(--red)}
.forgot{display:block;text-align:center;margin-top:16px;font-size:11.5px;color:var(--text3);text-decoration:none;transition:color .15s}
.forgot:hover{color:var(--text2)}
.foot{text-align:center;margin-top:24px;font-size:10px;color:var(--text3);letter-spacing:.5px}
.spinner{width:15px;height:15px;border:2px solid rgba(4,24,26,.3);border-top-color:#04181a;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <div class="logo-text">LAAAMB</div>
      <div class="logo-sub">Corderos de Especialidad Cárnica</div>
    </div>
    <div class="title" id="login-title">Plataforma de gestión operacional</div>
    <div class="subtitle" id="login-subtitle">Ingresa con tu correo y contraseña</div>

    <!-- ── INVITACIÓN: crear contraseña (oculto hasta detectar token) ── -->
    <div id="invite-card" style="display:none">
      <div style="text-align:center;margin-bottom:6px">
        <span style="display:inline-block;background:rgba(46,199,122,.12);border:1px solid rgba(46,199,122,.35);color:var(--green);font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px">✅ Invitación aceptada</span>
      </div>
      <div class="title" style="margin-top:18px">Crea tu contraseña de acceso</div>
      <div class="subtitle" id="invite-email" style="margin-bottom:22px">—</div>
      <form id="invite-form" autocomplete="on">
        <div class="field">
          <label for="inv-pass">Nueva contraseña</label>
          <div class="pw-wrap">
            <input type="password" id="inv-pass" placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
            <button type="button" class="pw-eye" data-target="inv-pass" aria-label="Mostrar contraseña">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" width="18" height="18"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6z"/><circle cx="10" cy="10" r="2.5"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="inv-pass2">Confirmar contraseña</label>
          <div class="pw-wrap">
            <input type="password" id="inv-pass2" placeholder="Repite la contraseña" required autocomplete="new-password">
            <button type="button" class="pw-eye" data-target="inv-pass2" aria-label="Mostrar contraseña">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" width="18" height="18"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6z"/><circle cx="10" cy="10" r="2.5"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn" id="inv-btn"><span id="inv-btn-label">Crear contraseña y entrar →</span></button>
      </form>
    </div>

    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@correo.com" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="pw-eye" id="pw-toggle" aria-label="Mostrar contraseña">
            <svg id="pw-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" width="18" height="18"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6z"/><circle cx="10" cy="10" r="2.5"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn" id="submit-btn">
        <span id="btn-label">Ingresar</span>
      </button>
    </form>

    <div class="msg" id="msg"></div>

    <a class="forgot" id="login-forgot" href="#" onclick="return false">¿Olvidaste tu contraseña? Contacta al administrador</a>

    <div class="foot">LAAAMBAPP · La Marinilla · Ibagué, Tolima</div>
  </div>

<script>
(function(){
  var form = document.getElementById('login-form');
  var emailEl = document.getElementById('email');
  var passEl = document.getElementById('password');
  var btn = document.getElementById('submit-btn');
  var btnLabel = document.getElementById('btn-label');
  var msg = document.getElementById('msg');

  function showMsg(text, type){
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }

  // Base de la app: '/laaambapp/' en GitHub Pages, '/' en Vercel/raíz.
  function basePath(){
    return window.location.pathname.includes('/laaambapp/') ? '/laaambapp/' : '/';
  }

  // Mostrar/ocultar contraseña
  var pwToggle = document.getElementById('pw-toggle');
  var pwIcon = document.getElementById('pw-icon');
  var EYE = '<path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6z"/><circle cx="10" cy="10" r="2.5"/>';
  var EYE_OFF = '<path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6z"/><circle cx="10" cy="10" r="2.5"/><line x1="3" y1="3" x2="17" y2="17"/>';
  pwToggle.addEventListener('click', function(){
    var show = passEl.type === 'password';
    passEl.type = show ? 'text' : 'password';
    pwIcon.innerHTML = show ? EYE_OFF : EYE;
    pwToggle.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
  });

  // Mostrar mensaje si el redirect trae ?error=sin_acceso
  var params = new URLSearchParams(window.location.search);
  if(params.get('error') === 'sin_acceso'){
    showMsg('Tu cuenta no tiene acceso autorizado. Contacta a Juan Manuel Arbelaez.', 'err');
  }

  // ── Eye toggles del formulario de invitación ──
  document.querySelectorAll('#invite-card .pw-eye').forEach(function(b){
    b.addEventListener('click', function(){
      var inp = document.getElementById(b.getAttribute('data-target'));
      if(!inp) return;
      var show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      var svg = b.querySelector('svg'); if(svg) svg.innerHTML = show ? EYE_OFF : EYE;
    });
  });

  // ── PASO 1: detectar token de invitación / recuperación en la URL ──
  async function detectarInvite(){
    var hash = window.location.hash.substring(1);
    var params = new URLSearchParams(hash);
    var queryParams = new URLSearchParams(window.location.search);
    var type = params.get('type') || queryParams.get('type');
    var accessToken = params.get('access_token') || queryParams.get('access_token');
    var refreshToken = params.get('refresh_token') || queryParams.get('refresh_token');
    if((type === 'invite' || type === 'recovery') && accessToken){
      try{
        var res = await window._sb.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken || ''
        });
        if(!res.error && res.data && res.data.session){
          mostrarFormularioContrasena(res.data.session.user);
          return true;
        }
      }catch(e){}
    }
    return false;
  }

  // ── PASO 2: mostrar el formulario de nueva contraseña ──
  function mostrarFormularioContrasena(user){
    ['login-form','login-title','login-subtitle','login-forgot'].forEach(function(id){
      var el = document.getElementById(id); if(el) el.style.display = 'none';
    });
    var card = document.getElementById('invite-card'); if(card) card.style.display = 'block';
    var em = document.getElementById('invite-email');
    if(em && user) em.textContent = 'Bienvenido, ' + (user.email || '');
    var p = document.getElementById('inv-pass'); if(p) p.focus();
  }

  // ── PASO 3: guardar la contraseña y entrar ──
  async function crearContrasena(password, confirmPassword){
    if((password||'').length < 8){ showMsg('La contraseña debe tener mínimo 8 caracteres', 'err'); return; }
    if(password !== confirmPassword){ showMsg('Las contraseñas no coinciden', 'err'); return; }
    var ib = document.getElementById('inv-btn'), il = document.getElementById('inv-btn-label');
    if(ib){ ib.disabled = true; ib.insertAdjacentHTML('afterbegin','<span class="spinner" id="inv-spin"></span>'); }
    if(il) il.textContent = 'Guardando contraseña…';
    function resetInv(){ var s=document.getElementById('inv-spin'); if(s) s.remove(); if(ib) ib.disabled=false; if(il) il.textContent='Crear contraseña y entrar →'; }
    try{
      var up = await window._sb.auth.updateUser({ password: password });
      if(up.error){ resetInv(); showMsg('Error: ' + up.error.message, 'err'); return; }
      var ures = await window._sb.auth.getUser();
      var user = ures && ures.data && ures.data.user;
      var pr = await window._sb.from('perfiles').select('rol, nombre, activo').eq('id', user.id).single();
      var perfil = pr && pr.data;
      if(!perfil || !perfil.activo){ resetInv(); showMsg('Tu perfil no está activo. Contacta al administrador.', 'err'); return; }
      // Limpiar el hash de la URL (seguridad)
      history.replaceState(null, '', window.location.pathname);
      showMsg('✅ Contraseña creada. Entrando…', 'ok');
      window.location.href = basePath() + 'index.html';
    }catch(err){ resetInv(); showMsg('Error de conexión. Intenta de nuevo.', 'err'); }
  }

  var invForm = document.getElementById('invite-form');
  if(invForm){
    invForm.addEventListener('submit', function(e){
      e.preventDefault();
      crearContrasena(document.getElementById('inv-pass').value, document.getElementById('inv-pass2').value);
    });
  }

  // ── PASO 4: flujo de carga — invite primero; si no, login normal ──
  detectarInvite().then(function(isInvite){
    if(isInvite) return; // mostrando "crea tu contraseña"
    // Si ya hay sesión activa, ir directo al dashboard
    window._sb.auth.getSession().then(function(res){
      if(res && res.data && res.data.session){
        window.location.href = basePath() + 'index.html';
      }
    });
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var email = emailEl.value.trim();
    var password = passEl.value;
    if(!email || !password){ showMsg('Escribe tu correo y contraseña.', 'err'); return; }

    btn.disabled = true;
    btnLabel.textContent = 'Ingresando…';
    btn.insertAdjacentHTML('afterbegin', '<span class="spinner" id="btn-spin"></span>');

    function resetBtn(){
      var spin = document.getElementById('btn-spin');
      if(spin) spin.remove();
      btn.disabled = false;
      btnLabel.textContent = 'Ingresar';
    }

    try {
      var { data, error } = await window._sb.auth.signInWithPassword({
        email: email,
        password: password
      });

      if(error){
        resetBtn();
        showMsg('Correo o contraseña incorrectos', 'err');
        return;
      }

      // Verificar que tiene perfil activo antes de redirigir
      var { data: perfil } = await window._sb.from('perfiles')
        .select('rol, nombre, activo')
        .eq('id', data.user.id)
        .single();

      if(!perfil || !perfil.activo){
        await window._sb.auth.signOut();
        resetBtn();
        showMsg('Tu cuenta no tiene acceso autorizado. Contacta a Juan Manuel Arbelaez.', 'err');
        return;
      }

      // Redirigir según el origen (GitHub Pages vs Vercel)
      window.location.href = basePath() + 'index.html';
    } catch(err){
      resetBtn();
      showMsg('Error de conexión. Intenta de nuevo.', 'err');
    }
  });
})();
</script>
</body>
</html>
