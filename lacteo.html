<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#00AFB6;--teal-d:#008a90;--teal-bg:rgba(0,175,182,.10);--teal-bg2:rgba(0,175,182,.06);
  --wine:#9C3F66;--wine-bg:rgba(156,63,102,.12);--orange:#F18F22;--orange-bg:rgba(241,143,34,.12);
  --bg:#080f10;--bg2:#0c1517;--bg3:#101d1f;--bg4:#152224;--surface:#172628;--surface2:#1d3235;
  --border:rgba(0,175,182,.10);--border2:rgba(0,175,182,.20);--border3:rgba(0,175,182,.35);
  --green:#2ec77a;--green-bg:rgba(46,199,122,.10);--red:#e05252;--red-bg:rgba(224,82,82,.10);
  --amber:#e8a030;--amber-bg:rgba(232,160,48,.10);--sky:#38b0d8;--sky-bg:rgba(56,176,216,.10);
  --text:#d8edef;--text2:#7eadb2;--text3:#3d6e74;--text4:#1e3f44;
  --r:8px;--r2:14px;--sidebar:236px;--anim:.16s cubic-bezier(.4,0,.2,1)}
html[data-theme="light"]{--teal:#00AFB6;--teal-d:#008a90;--teal-bg:rgba(0,175,182,.10);--teal-bg2:rgba(0,175,182,.05);--wine:#9C3F66;--wine-bg:rgba(156,63,102,.10);--orange:#F18F22;--orange-bg:rgba(241,143,34,.10);--bg:#F8F9FA;--bg2:#FFFFFF;--bg3:#F3F4F6;--bg4:#FAFAFA;--surface:#FFFFFF;--surface2:#F3F4F6;--border:#E5E7EB;--border2:#D1D5DB;--border3:#9CA3AF;--green:#10B981;--green-bg:rgba(16,185,129,.10);--red:#EF4444;--red-bg:rgba(239,68,68,.10);--amber:#F59E0B;--amber-bg:rgba(245,158,11,.10);--sky:#38B0D8;--sky-bg:rgba(56,176,216,.10);--text:#1A1A2E;--text2:#6B7280;--text3:#9CA3AF;--text4:#C4C9D4}
html[data-theme="dark"]{--teal:#00AFB6;--teal-d:#008a90;--teal-bg:rgba(0,175,182,.12);--teal-bg2:rgba(0,175,182,.06);--wine:#9C3F66;--wine-bg:rgba(156,63,102,.15);--orange:#F18F22;--orange-bg:rgba(241,143,34,.15);--bg:#0F172A;--bg2:#1E293B;--bg3:#1E293B;--bg4:#162032;--surface:#1E293B;--surface2:#162032;--border:#334155;--border2:#3E4C61;--border3:#475569;--green:#10B981;--green-bg:rgba(16,185,129,.14);--red:#EF4444;--red-bg:rgba(239,68,68,.14);--amber:#F59E0B;--amber-bg:rgba(245,158,11,.14);--sky:#38B0D8;--sky-bg:rgba(56,176,216,.14);--text:#F1F5F9;--text2:#94A3B8;--text3:#64748B;--text4:#475569}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Changa',sans-serif;font-size:14px;line-height:1.5;overflow:hidden}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:2px}
.app{display:flex;height:100vh;width:100vw}
.sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:10;flex-shrink:0}
.sidebar::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--teal),transparent);opacity:.5}
.sb-head{padding:20px 16px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-bottom:4px}.sb-logo-img{height:40px;width:40px;border-radius:9px;flex-shrink:0}
.sb-logo-text{font-family:'Sigmar',cursive;font-size:17px;letter-spacing:.5px;color:var(--teal)}
.sb-logo-sub{font-size:9px;font-weight:600;color:var(--teal-d);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px}
.nav-scroll{flex:1;overflow-y:auto;padding:8px 0}
.nav-group{padding:14px 14px 4px;font-size:9px;font-weight:700;color:var(--text4);letter-spacing:1.2px;text-transform:uppercase}
.nav-link{display:flex;align-items:center;gap:9px;padding:8px 10px;margin:1px 8px;border-radius:var(--r);cursor:pointer;color:var(--text2);font-size:13px;text-decoration:none;transition:all var(--anim);position:relative}
.nav-link:hover{background:var(--surface);color:var(--text)}
.nav-link.active{background:var(--teal-bg);color:var(--teal);border:1px solid var(--border2)}
.nav-link.active::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:2px;background:var(--teal);border-radius:2px}
.nav-ico{width:15px;height:15px;flex-shrink:0;opacity:.6}.nav-link.active .nav-ico,.nav-link:hover .nav-ico{opacity:1}
.nav-badge{margin-left:auto;font-size:10px;font-weight:600;background:var(--surface2);color:var(--teal);padding:1px 7px;border-radius:10px;border:1px solid var(--border2)}
.sb-foot{flex-shrink:0;padding:12px;border-top:1px solid var(--border);background:var(--bg2)}
.user-row{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--surface);border-radius:var(--r);border:1px solid var(--border)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--teal-bg);border:1.5px solid var(--teal-d);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--teal);flex-shrink:0}
.user-name{font-size:12px;font-weight:600;color:var(--text)}.user-role{font-size:10px;color:var(--text3)}
#lham{display:none;position:fixed;top:12px;left:12px;z-index:9999;background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--r);width:46px;height:46px;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 16px rgba(0,0,0,.45)}
#lham svg{width:22px;height:22px;stroke:var(--text);stroke-width:2;fill:none;stroke-linecap:round}
#lov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9990}
#lov.on{display:block}
.main{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
.page-head{margin-bottom:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph-eyebrow{font-size:10px;font-weight:700;color:var(--teal-d);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px}
.ph-title{font-family:'Sigmar',cursive;font-size:30px;color:var(--text);line-height:1.1}
.ph-sub{font-size:12px;color:var(--text3);margin-top:3px}
.period-tg{display:flex;gap:6px}
.period-tg button{background:var(--bg2);border:1px solid var(--border2);color:var(--text2);font-family:inherit;font-size:12px;font-weight:600;padding:7px 13px;border-radius:99px;cursor:pointer}
.period-tg button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.sec{margin-bottom:22px}
.sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-title .dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.sec-title a{margin-left:auto;font-size:11px;font-weight:600;color:var(--teal);text-decoration:none;text-transform:none;letter-spacing:0}
.empty-box{padding:22px;text-align:center;color:var(--text3);font-size:13px;background:var(--bg2);border:1px dashed var(--border2);border-radius:var(--r2);line-height:1.6}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:15px;position:relative}
.kpi .kdot{position:absolute;top:14px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--text4)}
.kpi .kdot.g{background:var(--green)}.kpi .kdot.a{background:var(--amber)}.kpi .kdot.r{background:var(--red)}
.kpi .v{font-family:'Sigmar',cursive;font-size:23px;color:var(--text);line-height:1}
.kpi .v small{font-size:12px;color:var(--text3);font-family:'Changa',sans-serif}
.kpi .k{font-size:11px;color:var(--text3);margin-top:5px}
.kpi .trend{font-size:11px;font-weight:700;margin-top:3px;color:var(--text3)}
/* Ranking */
.rank-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rank-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:14px}
.rank-card h4{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:10px}
.rank-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.rank-row:last-child{border-bottom:none}
.rank-row .nm{flex:1;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .vv{font-weight:700;color:var(--teal)}
.rank-row .mt{font-size:10px;color:var(--text3);white-space:nowrap}
/* Sala cuna mini */
.cuna-mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.cuna-mini{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:11px 13px}
.cuna-mini .nm{font-weight:700;color:var(--text);font-size:13px}
.cuna-mini .row{font-size:11px;color:var(--text2);margin-top:3px;display:flex;justify-content:space-between;gap:6px}
.cbar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px}
.cbar>i{display:block;height:100%;border-radius:99px}
.alert-venc{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--red-bg);border:1px solid rgba(224,82,82,.3);border-radius:var(--r);color:var(--red);font-size:13px;font-weight:600;margin-bottom:10px;text-decoration:none}
/* Lotes mini */
.lote-mini{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:8px;font-size:13px}
.lote-mini .lt{font-weight:700;color:var(--text);text-transform:capitalize}
.lote-mini .lm{font-size:11px;color:var(--text3)}
@media(max-width:768px){
  #lham{display:flex}
  #sidebar{position:fixed!important;top:0;left:0;height:100vh;transform:translateX(-100%);z-index:9995;transition:transform .28s ease}
  #sidebar.on{transform:translateX(0)}
  .main{padding:12px;padding-top:64px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .rank-wrap{grid-template-columns:1fr}
  .ph-title{font-size:25px}
}
</style>
</head>

<script>
(function(){
  var open=false;
  var BARS='<line x1="3" y1="6" x2="19" y2="6"/><line x1="3" y1="11" x2="19" y2="11"/><line x1="3" y1="16" x2="19" y2="16"/>';
  var CROSS='<line x1="4" y1="4" x2="18" y2="18"/><line x1="18" y1="4" x2="4" y2="18"/>';
  function show(){open=true;document.getElementById('sidebar').classList.add('on');document.getElementById('lov').classList.add('on');document.getElementById('lico').innerHTML=CROSS;}

<script>
// ═══════════════════════════════════════════════════════════════════
//  LÁCTEO — dashboard integrado (Fase 8). Solo métodos db.js + _sb directo.
// ═══════════════════════════════════════════════════════════════════
(function(){
  'use strict';
  var DB = window.DB, SB = window._sb;
  var PERIODO = 30;

  function num(n,d){ d=(d==null?1:d); var f=Math.pow(10,d); return (Math.round((+n||0)*f)/f).toLocaleString('es-CO',{minimumFractionDigits:0,maximumFractionDigits:d}); }
  function cop(n){ return '$'+Math.round(+n||0).toLocaleString('es-CO'); }
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function isoDaysAgo(d){ return new Date(Date.now()-d*86400000).toISOString().split('T')[0]; }
  function avg(arr){ return arr.length ? arr.reduce(function(a,b){return a+b;},0)/arr.length : null; }
  function trend(cur, prev){
    if(cur==null || prev==null || prev===0) return '→';
    if(cur > prev*1.02) return '↑';
    if(cur < prev*0.98) return '↓';
    return '→';
  }

  window.setPeriodo = function(d){
    PERIODO = d;
    document.querySelectorAll('#period-tg button').forEach(function(b){ b.classList.toggle('on', +b.getAttribute('data-d')===d); });
    cargar();
  };

  function kpiCard(value, label, sem, trendTxt){
    return '<div class="kpi">'
      + (sem?'<div class="kdot '+sem+'"></div>':'')
      + '<div class="v">'+value+'</div>'
      + '<div class="k">'+label+'</div>'
      + (trendTxt?'<div class="trend">'+trendTxt+'</div>':'')
      + '</div>';
  }

  async function cargar(){
    var desdeISO = isoDaysAgo(PERIODO);
    var prevDesdeISO = isoDaysAgo(PERIODO*2);
    var hayDatos = false;

    // ── Datos base ──
    var ctr = [];
    try{ var cr = await SB.from('controles_lecheros').select('leche_dia_l, fecha').gte('fecha', prevDesdeISO); ctr = (cr.data)||[]; }catch(e){}
    var lotes = [];
    try{ var lr = await DB.getQuesosLotes(300); lotes = (lr&&lr.data)||[]; }catch(e){}

    // ── KPI 1: Leche L/día (avg leche_dia_l) ──
    var lecheCur = avg(ctr.filter(function(c){ return c.fecha>=desdeISO && c.leche_dia_l!=null; }).map(function(c){ return Number(c.leche_dia_l); }));
    var lechePrev = avg(ctr.filter(function(c){ return c.fecha>=prevDesdeISO && c.fecha<desdeISO && c.leche_dia_l!=null; }).map(function(c){ return Number(c.leche_dia_l); }));
    if(lecheCur!=null) hayDatos=true;
    var lecheSem = lecheCur==null?'':(lecheCur>0.8?'g':(lecheCur>=0.4?'a':'r'));

    // ── KPI 2: Queso kg ──
    var lotesCur = lotes.filter(function(l){ return l.fecha>=desdeISO; });
    var lotesPrev = lotes.filter(function(l){ return l.fecha>=prevDesdeISO && l.fecha<desdeISO; });
    if(lotesCur.length) hayDatos=true;
    var quesoCur = lotesCur.reduce(function(s,l){ return s+(Number(l.queso_kg)||0); },0);
    var quesoPrev = lotesPrev.reduce(function(s,l){ return s+(Number(l.queso_kg)||0); },0);

    // ── KPI 3: Rendimiento L/kg ──
    var rendCur = avg(lotesCur.filter(function(l){ return l.rendimiento_l_por_kg!=null; }).map(function(l){ return Number(l.rendimiento_l_por_kg); }));
    var rendPrev = avg(lotesPrev.filter(function(l){ return l.rendimiento_l_por_kg!=null; }).map(function(l){ return Number(l.rendimiento_l_por_kg); }));
    var rendSem = rendCur==null?'':(rendCur<4.5?'g':(rendCur<=6?'a':'r'));

    // ── KPI 4: Margen bruto ──
    var lotesMargen = lotesCur.filter(function(l){ return l.precio_venta_kg!=null && Number(l.costo_total)>0; });
    var margenCur = lotesMargen.reduce(function(s,l){ return s+((Number(l.ingreso_total)||0)-(Number(l.costo_total)||0)); },0);
    var lotesMargenPrev = lotesPrev.filter(function(l){ return l.precio_venta_kg!=null && Number(l.costo_total)>0; });
    var margenPrev = lotesMargenPrev.reduce(function(s,l){ return s+((Number(l.ingreso_total)||0)-(Number(l.costo_total)||0)); },0);
    var margenSem = lotesMargen.length ? (margenCur>0?'g':'r') : '';

    // ── KPI 5: Compliance sala cuna 7d (fijo) ──
    var compPct = null, compAgg = {};
    try{
      var sieteAgo = isoDaysAgo(7);
      var cmp = await SB.from('tomas_programadas').select('corderos_crianza_id, estado').gte('fecha_hora_programada', sieteAgo+'T00:00:00').in('estado',['cumplida','perdida']);
      var rows=(cmp.data)||[]; var ok=0,tot=0;
      rows.forEach(function(t){ tot++; if(t.estado==='cumplida')ok++; var a=compAgg[t.corderos_crianza_id]||(compAgg[t.corderos_crianza_id]={ok:0,tot:0}); a.tot++; if(t.estado==='cumplida')a.ok++; });
      compPct = tot ? Math.round(ok/tot*100) : null;
    }catch(e){}
    var compSem = compPct==null?'':(compPct>=90?'g':(compPct>=70?'a':'r'));

    // ── KPI 6: Mortalidad corderos crianza (all-time) ──
    var mortPct = null;
    try{
      var rcAll = await DB.getCorderosCrianza(false);
      var all=(rcAll&&rcAll.data)||[];
      if(all.length){
        var muertos=all.filter(function(c){return c.estado==='muerto';}).length;
        mortPct = Math.round(muertos/all.length*100);
        hayDatos=true;
      }
    }catch(e){}
    var mortSem = mortPct==null?'':(mortPct<5?'g':(mortPct<=15?'a':'r'));

    // ── Render KPIs ──
    document.getElementById('kpis').innerHTML =
        kpiCard(lecheCur!=null?(num(lecheCur,2)+' <small>L/día</small>'):'—','Leche · prom. por oveja', lecheSem, lecheCur!=null?(trend(lecheCur,lechePrev)+' vs período previo'):'')
      + kpiCard(num(quesoCur,1)+' <small>kg</small>','Queso producido','', trend(quesoCur,quesoPrev)+' vs período previo')
      + kpiCard(rendCur!=null?(num(rendCur,2)+' <small>L/kg</small>'):'—','Rendimiento real', rendSem, rendCur!=null?(trend(rendPrev,rendCur)+' vs previo'):'')
      + kpiCard(lotesMargen.length?cop(margenCur):'Sin datos','Margen bruto', margenSem, lotesMargen.length?(trend(margenCur,margenPrev)+' vs previo'):'')
      + kpiCard(compPct!=null?(compPct+'%'):'—','Compliance Sala Cuna · 7d', compSem, '')
      + kpiCard(mortPct!=null?(mortPct+'%'):'—','Mortalidad crianza', mortSem, '');

    // ── [C] Ranking ──
    await renderRanking();
    // ── [D] Sala cuna ──
    await renderCuna(compAgg);
    // ── [E] Lotes mini ──
    renderLotesMini(lotes.slice(0,3));

    // ── [F] Estado vacío global ──
    document.getElementById('empty-global').innerHTML = hayDatos ? '' :
      '<div class="empty-box">No hay datos lácteos registrados en los últimos '+PERIODO+' días.<br>Comienza registrando una lactancia o un lote de queso.</div>';
  }

  async function renderRanking(){
    var cont = document.getElementById('ranking');
    var rl = await DB.getLactancias(true);
    var lacts = (rl&&rl.data)||[];
    if(!lacts.length){ cont.innerHTML = '<div class="empty-box" style="grid-column:1/-1">Sin controles lecheros registrados aún</div>'; return; }
    // scores maternos
    var scores = {};
    try{
      var ids = lacts.map(function(l){return l.animal_id;}).filter(Boolean);
      if(ids.length){ var sr = await SB.from('animales').select('id, score_materno').in('id', ids); (sr.data||[]).forEach(function(a){ scores[a.id]=a.score_materno; }); }
    }catch(e){}
    var enriched = [];
    for(var i=0;i<lacts.length;i++){
      var l=lacts[i]; var ctr=(l.controles||[]); var ult=ctr.length?ctr[ctr.length-1]:null;
      var litros = ult && ult.leche_dia_l!=null ? Number(ult.leche_dia_l) : null;
      var comp = ult ? { grasa_pct: ult.grasa_pct, caseina_pct: ult.caseina_pct } : {};
      var ro = await DB.calcularRendimientoTeorico(null, comp);
      var rendTeo = ro.rendimiento_l_kg || 3.9;
      var diasLact = l.fecha_parto ? Math.max(0, Math.floor((Date.now()-new Date(l.fecha_parto))/86400000)) : null;
      enriched.push({
        nombre: (l.animal && (l.animal.nombre||l.animal.codigo))||'Oveja',
        litros: litros, dias: diasLact, score: scores[l.animal_id],
        rendTeo: rendTeo, quesoEq: (litros!=null && rendTeo>0) ? litros/rendTeo : null
      });
    }
    var topProd = enriched.filter(function(e){return e.litros!=null;}).sort(function(a,b){return b.litros-a.litros;}).slice(0,5);
    var topQueso = enriched.filter(function(e){return e.quesoEq!=null;}).sort(function(a,b){return b.quesoEq-a.quesoEq;}).slice(0,5);
    function rowsProd(){
      if(!topProd.length) return '<div class="rank-row"><span class="mt">Sin datos</span></div>';
      return topProd.map(function(e){ return '<div class="rank-row"><span class="nm">'+esc(e.nombre)+'</span><span class="vv">'+num(e.litros,2)+' L</span><span class="mt">'+(e.dias!=null?e.dias+'d':'—')+(e.score!=null?(' · ♥'+e.score):'')+'</span></div>'; }).join('');
    }
    function rowsQueso(){
      if(!topQueso.length) return '<div class="rank-row"><span class="mt">Sin datos</span></div>';
      return topQueso.map(function(e){ return '<div class="rank-row"><span class="nm">'+esc(e.nombre)+'</span><span class="vv">'+num(e.quesoEq,2)+' kg/d</span><span class="mt">'+num(e.rendTeo,1)+' L/kg</span></div>'; }).join('');
    }
    cont.innerHTML =
        '<div class="rank-card"><h4>🥛 Top por producción</h4>'+rowsProd()+'</div>'
      + '<div class="rank-card"><h4>🧀 Top por queso-equivalente</h4>'+rowsQueso()+'</div>';
  }

  async function renderCuna(compAgg){
    var cont = document.getElementById('cuna-panel');
    var rc = await DB.getCorderosCrianza(true);
    var corderos = (rc&&rc.data)||[];
    var venc = 0;
    try{ var rv = await DB.getTomasVencidas(); venc = (rv&&rv.data?rv.data.length:0); }catch(e){}
    var html = '';
    if(venc>0) html += '<a class="alert-venc" href="sala-cuna.html">⏰ '+venc+' toma'+(venc===1?'':'s')+' vencida'+(venc===1?'':'s')+' — ver Sala Cuna →</a>';
    html += '<div style="font-size:13px;color:var(--text2);margin-bottom:4px">Corderos activos: <b style="color:var(--text)">'+corderos.length+'</b></div>';
    if(!corderos.length){ cont.innerHTML = html + '<div class="empty-box" style="margin-top:8px">No hay corderos en crianza.</div>'; return; }
    var minis = [];
    for(var i=0;i<corderos.length;i++){
      var c=corderos[i];
      var nombre=(c.cordero && (c.cordero.nombre||c.cordero.codigo))||'Cordero';
      var dias = c.fecha_inicio ? Math.floor((Date.now()-new Date(c.fecha_inicio))/86400000) : null;
      var gmd=null; try{ gmd=await DB.calcularGMD(c.cordero_id); }catch(e){}
      var cal=0; try{ cal=await DB.getCalostroTotal24h(c.cordero_id); }catch(e){}
      var calIco = cal>0?'✅':'🔴';
      var a=compAgg&&compAgg[c.id]; var comp=(a&&a.tot)?Math.round(a.ok/a.tot*100):null;
      var compCls = comp==null?'':(comp>=90?'var(--green)':(comp>=70?'var(--amber)':'var(--red)'));
      minis.push('<div class="cuna-mini"><div class="nm">'+esc(nombre)+'</div>'
        + '<div class="row"><span>'+(dias!=null?dias+' días':'—')+'</span><span>'+calIco+' calostro</span></div>'
        + '<div class="row"><span>GMD '+(gmd!=null?Math.round(gmd*1000)+' g/d':'—')+'</span><span>'+(comp!=null?comp+'%':'—')+'</span></div>'
        + (comp!=null?'<div class="cbar"><i style="width:'+comp+'%;background:'+compCls+'"></i></div>':'')
        + '</div>');
    }
    cont.innerHTML = html + '<div class="cuna-mini-grid">'+minis.join('')+'</div>';
  }

  function renderLotesMini(lotes){
    var cont = document.getElementById('lotes-mini');
    if(!lotes.length){ cont.innerHTML = '<div class="empty-box">Sin lotes de queso registrados.</div>'; return; }
    cont.innerHTML = lotes.map(function(l){
      var rend = l.rendimiento_l_por_kg!=null?Number(l.rendimiento_l_por_kg):null;
      var margen = (l.precio_venta_kg!=null && Number(l.costo_total)>0) ? ((Number(l.ingreso_total)||0)-(Number(l.costo_total)||0)) : null;
      return '<div class="lote-mini"><div><span class="lt">🧀 '+esc(l.tipo_queso||'queso')+'</span> <span class="lm">· '+esc(l.fecha)+'</span></div>'
        + '<div style="text-align:right"><div><b>'+num(l.queso_kg,1)+' kg</b> · '+(rend!=null?num(rend,1)+' L/kg':'—')+'</div>'
        + (margen!=null?'<div class="lm">'+cop(margen)+' margen</div>':'')+'</div></div>';
    }).join('');
  }

  function whenReady(cb){ if(window.AUTH_ROL){ cb(); return; } var n=0,iv=setInterval(function(){ if(window.AUTH_ROL||n>50){ clearInterval(iv); cb(); } n++; },100); }
  document.addEventListener('DOMContentLoaded', function(){ whenReady(cargar); });
})();
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
