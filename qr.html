<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00AFB6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LAAAMB">
<link rel="apple-touch-icon" href="icons/icon-laaamb.jpg">
  <meta name="msapplication-TileImage" content="icons/icon-laaamb.jpg">
<title>LAAAMB · Trazabilidad verificada</title>
<link href="https://fonts.googleapis.com/css2?family=Sigmar&family=Changa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Supabase JS SDK (PÚBLICO — sin autenticación) -->
<!-- Sentry: monitoreo de errores -->
<script
  src="https://js.sentry-cdn.com/16a09522e75d0a3fe4cec3bb077c1c32.min.js"
  crossorigin="anonymous"
></script>
<script src="js/error-handler.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
  window._sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
</script>
<!-- Generador de QR real (cliente) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#00AFB6;--teal-d:#008a90;--teal-l:#39d4db;--bg:#0a0f14;--bg2:#121a21;--bg3:#19242d;
  --green:#2ec77a;--amber:#e8a030;--red:#e05252;--gold:#d9b25a;
  --text:#e2f3f4;--text2:#8fbabf;--text3:#52828a;--text4:#33565c;
  --border:rgba(0,175,182,.16);--border2:rgba(0,175,182,.28);--r:14px;--r2:18px}
html,body{background:var(--bg);color:var(--text);font-family:'Changa',sans-serif;font-size:15px;line-height:1.55;min-height:100vh}
body{background:
  radial-gradient(circle at 50% -10%,rgba(0,175,182,.10),transparent 55%),
  radial-gradient(circle at 50% 105%,rgba(0,175,182,.06),transparent 45%),
  var(--bg)}
.wrap{max-width:500px;margin:0 auto;padding:26px 16px 52px}

/* HEADER / BRAND */
.brand{text-align:center;margin-bottom:22px}
.brand-logo{font-family:'Sigmar',cursive;font-size:40px;color:var(--teal);letter-spacing:1px;line-height:1;text-shadow:0 0 24px rgba(0,175,182,.35)}
.brand-sub{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--teal-d);margin-top:5px}
.brand-finca{font-size:11.5px;color:var(--text3);margin-top:9px;letter-spacing:.3px}

/* HERO — sello de trazabilidad verificada (sin foto de animal) */
.hero{background:linear-gradient(165deg,#16323a 0%,#0e1820 100%);border:1px solid var(--border2);border-radius:var(--r2);padding:34px 22px 28px;text-align:center;margin-bottom:18px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(0,175,182,.18),transparent 65%)}
.seal{width:96px;height:96px;margin:0 auto;position:relative;display:flex;align-items:center;justify-content:center}
.seal-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--border2);animation:pulse 2.6s ease-in-out infinite}
.seal-ring.r2{inset:10px;border-color:rgba(46,199,122,.30)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:.7}}
.seal-core{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#2ee08a,#1a9455);display:flex;align-items:center;justify-content:center;box-shadow:0 0 28px rgba(46,199,122,.5);position:relative}
.seal-core svg{width:34px;height:34px;color:#06120c;stroke-width:3}
.badge-verif{display:inline-flex;align-items:center;gap:7px;background:rgba(46,199,122,.14);border:1px solid rgba(46,199,122,.42);color:var(--green);font-size:11.5px;font-weight:700;letter-spacing:.4px;padding:6px 14px;border-radius:999px;margin-top:18px;position:relative;text-transform:uppercase}
.hero-corte{font-family:'Sigmar',cursive;font-size:30px;color:#fff;margin-top:18px;position:relative;text-transform:capitalize;line-height:1.15}
.hero-peso{font-size:18px;color:var(--teal-l);font-weight:700;position:relative;margin-top:2px}
.hero-peso small{font-size:12px;color:var(--text2);font-weight:500}
.hero-qrcode{font-family:'Changa',monospace;font-size:12px;color:var(--text3);letter-spacing:1.5px;margin-top:10px;position:relative}

/* SEMÁFORO */
.semaforo{display:flex;align-items:center;gap:13px;padding:15px 17px;border-radius:var(--r);margin-bottom:14px;border:1px solid}
.semaforo.verde{background:rgba(46,199,122,.10);border-color:rgba(46,199,122,.32)}
.semaforo.amarillo{background:rgba(232,160,48,.10);border-color:rgba(232,160,48,.32)}
.semaforo.rojo{background:rgba(224,82,82,.10);border-color:rgba(224,82,82,.32)}
.sem-dot{width:15px;height:15px;border-radius:50%;flex-shrink:0}
.semaforo.verde .sem-dot{background:var(--green);box-shadow:0 0 12px var(--green)}
.semaforo.amarillo .sem-dot{background:var(--amber);box-shadow:0 0 12px var(--amber)}
.semaforo.rojo .sem-dot{background:var(--red);box-shadow:0 0 12px var(--red)}
.sem-txt b{display:block;font-size:13.5px;color:var(--text)}
.sem-txt span{font-size:11.5px;color:var(--text3)}

/* BADGE CADENA DE FRÍO */
.cold-badge{display:flex;align-items:center;gap:11px;padding:13px 16px;border-radius:var(--r);margin-bottom:18px;border:1px solid;font-size:12.5px}
.cold-badge.ok{background:rgba(56,176,216,.10);border-color:rgba(56,176,216,.32);color:#7ed0e8}
.cold-badge.bad{background:rgba(224,82,82,.10);border-color:rgba(224,82,82,.32);color:#f0a0a0}
.cold-badge svg{width:20px;height:20px;flex-shrink:0}
.cold-badge b{display:block;color:var(--text);font-size:13px}

/* SECCIÓN / CARD */
.sec{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:4px 18px;margin-bottom:16px}
.sec-h{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--teal);padding:16px 0 10px;border-bottom:1px solid var(--border)}
.sec-h .n{width:22px;height:22px;border-radius:50%;background:var(--teal-bg,rgba(0,175,182,.14));border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--teal-l);flex-shrink:0}
.info-row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
.info-row:last-child{border-bottom:none}
.info-row .k{color:var(--text3)}
.info-row .v{color:var(--text);font-weight:600;text-align:right}
.info-row .v.big{font-size:18px;color:var(--teal-l)}
/* flujo de peso */
.flow{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:14px 0;border-bottom:1px solid var(--border)}
.flow-step{text-align:center;flex:1}
.flow-step .fv{font-size:16px;font-weight:700;color:var(--text)}
.flow-step .fl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.flow-arrow{color:var(--teal-d);font-size:16px;flex-shrink:0}
/* atributos / chips */
.attrs{display:flex;flex-wrap:wrap;gap:7px;padding:13px 0 15px}
.attr-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(0,175,182,.08);border:1px solid var(--border);color:var(--text2);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px}
.attr-chip svg{width:12px;height:12px;color:var(--green)}

/* SOBRE LAAAMB */
.about{background:linear-gradient(155deg,#16323a,#121a21);border:1px solid var(--border2);border-radius:var(--r2);padding:22px;margin-bottom:18px}
.about h3{font-family:'Sigmar',cursive;font-size:19px;color:var(--teal);margin-bottom:10px}
.about p{font-size:13px;color:var(--text2);line-height:1.65}
.about p+p{margin-top:9px}

/* FOOTER con QR */
.foot{text-align:center;margin-top:24px}
.foot-qr{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:var(--r);padding:11px;margin-bottom:14px}
.foot-line{font-size:11.5px;color:var(--text3);line-height:1.8}
.foot-line b{color:var(--text2)}
.foot a{color:var(--teal);text-decoration:none;font-weight:600}

/* STATES */
.center-state{min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.center-state .brand-logo{font-size:48px}
.center-state p{color:var(--text3);font-size:14px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="center-state">
    <div class="spinner"></div>
    <p>Verificando trazabilidad…</p>
  </div>
</div>

<script>
(function(){
  var TIPO_LABEL = {
    canal_completa:'Canal completa', cuarto_delantero:'Cuarto delantero', cuarto_trasero:'Cuarto trasero',
    rack:'Rack', paleta:'Paleta', pierna:'Pierna', costillar:'Costillar', lomo:'Lomo',
    cuello:'Cuello', menudencias:'Menudencias', otro:'Corte premium'
  };
  var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function fmtFecha(f){ if(!f) return '—'; var d=new Date(f+'T00:00:00'); return d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear(); }
  function fmtFechaCorta(f){ if(!f) return '—'; var d=new Date(f+'T00:00:00'); var p=function(n){return (n<10?'0':'')+n;}; return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear(); }
  function mesesEntre(ini, fin){
    if(!ini) return null;
    var a = new Date(ini+'T00:00:00').getTime();
    var b = fin ? new Date(fin+'T00:00:00').getTime() : Date.now();
    var m = Math.round((b-a)/86400000/30.4);
    if(m < 1) return 'menos de 1 mes';
    if(m < 12) return m+' meses';
    var y=Math.floor(m/12), r=m%12;
    return y+' año'+(y>1?'s':'')+(r?' '+r+' m':'');
  }

  function noEncontrado(){
    document.getElementById('root').innerHTML =
      '<div class="center-state">'+
      '<div class="brand-logo">LAAAMB</div>'+
      '<div class="brand-sub">Corderos premium</div>'+
      '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#52828a" stroke-width="1.4" style="margin-top:10px"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>'+
      '<p>Producto no encontrado.<br>Verifica el código QR del empaque.</p>'+
      '</div>';
  }

  function render(d, frio){
    var corte = d.cortes || {};
    var animal = d.animales || {};
    var ben = d.beneficios || {};
    var lote = (animal.lotes && animal.lotes.nombre) || null;

    // ── Semáforo (verde >7d · amarillo 3-7d · rojo <3d) ──
    var semClase='verde', semTit='Producto fresco', semSub='En óptimas condiciones';
    if(d.fecha_limite_consumo){
      var dias = Math.ceil((new Date(d.fecha_limite_consumo+'T00:00:00') - Date.now())/86400000);
      if(dias < 0){ semClase='rojo'; semTit='Fecha de consumo vencida'; semSub='Venció el '+fmtFecha(d.fecha_limite_consumo); }
      else if(dias < 3){ semClase='rojo'; semTit='Consumir hoy'; semSub='Quedan '+dias+' día'+(dias===1?'':'s')+' — consumir de inmediato'; }
      else if(dias <= 7){ semClase='amarillo'; semTit='Consumir pronto'; semSub='Quedan '+dias+' días para el límite de consumo'; }
      else { semClase='verde'; semTit='Producto fresco'; semSub='Quedan '+dias+' días de óptima frescura'; }
    }

    var tipoLbl = TIPO_LABEL[corte.tipo_corte] || 'Corte premium';
    var edadSacrificio = mesesEntre(animal.fecha_nacimiento, ben.fecha);

    // ── Badge cadena de frío ──
    var coldHtml = '';
    if(frio && frio.length){
      var ult = frio[0];
      var t = parseFloat(ult.temperatura_c);
      var ok = !isNaN(t) && t < 4;
      var fh = ult.fecha_hora ? new Date(ult.fecha_hora) : null;
      var fhTxt = fh ? (fh.getDate()+' '+MESES[fh.getMonth()]+' '+fh.getFullYear()) : '';
      coldHtml =
        '<div class="cold-badge '+(ok?'ok':'bad')+'">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 2v20M4.5 7l15 10M19.5 7l-15 10"/><path d="M12 2l2.5 2.5M12 2l-2.5 2.5M12 22l2.5-2.5M12 22l-2.5-2.5"/></svg>'+
          '<div><b>'+(ok?'Cadena de frío verificada':'Alerta de temperatura')+'</b>'+
          'Último registro: '+esc(isNaN(t)?'—':t.toFixed(1))+' °C'+(fhTxt?' · '+esc(fhTxt):'')+'</div>'+
        '</div>';
    }

    var html =
      // BRAND
      '<div class="brand">'+
        '<div class="brand-logo">LAAAMB</div>'+
        '<div class="brand-sub">Corderos premium</div>'+
        '<div class="brand-finca">La Marinilla · Vereda San Bernardo · Ibagué · Tolima · Colombia</div>'+
      '</div>'+

      // HERO — sello verificado
      '<div class="hero">'+
        '<div class="seal">'+
          '<div class="seal-ring"></div><div class="seal-ring r2"></div>'+
          '<div class="seal-core"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>'+
        '</div>'+
        '<div class="badge-verif">✓ Trazabilidad verificada · LAAAMB</div>'+
        '<div class="hero-corte">'+esc(tipoLbl)+'</div>'+
        '<div class="hero-peso">'+esc(d.peso_neto)+' kg <small>· empaque al vacío</small></div>'+
        '<div class="hero-qrcode">'+esc(d.qr_code)+'</div>'+
      '</div>'+

      // SEMÁFORO + apto consumo
      '<div class="semaforo '+semClase+'">'+
        '<div class="sem-dot"></div>'+
        '<div class="sem-txt"><b>'+semTit+'</b><span>'+semSub+'</span></div>'+
      '</div>'+
      coldHtml+

      // ── SECCIÓN 1 · IDENTIDAD ──
      '<div class="sec">'+
        '<div class="sec-h"><span class="n">1</span>Identidad del producto</div>'+
        '<div class="info-row"><span class="k">Tipo de corte</span><span class="v big">'+esc(tipoLbl)+'</span></div>'+
        '<div class="info-row"><span class="k">Peso neto</span><span class="v big">'+esc(d.peso_neto)+' kg</span></div>'+
        '<div class="info-row"><span class="k">Código de trazabilidad</span><span class="v">'+esc(d.qr_code)+'</span></div>'+
        '<div class="info-row"><span class="k">Fecha de empaque</span><span class="v">'+fmtFecha(d.fecha_empaque)+'</span></div>'+
        (d.fecha_limite_consumo?'<div class="info-row"><span class="k">Apto para consumo hasta</span><span class="v">'+fmtFechaCorta(d.fecha_limite_consumo)+'</span></div>':'')+
      '</div>'+

      // ── SECCIÓN 2 · HISTORIA DEL ANIMAL ──
      '<div class="sec">'+
        '<div class="sec-h"><span class="n">2</span>Historia del animal</div>'+
        (animal.raza?'<div class="info-row"><span class="k">Raza</span><span class="v">'+esc(animal.raza)+'</span></div>':'')+
        (edadSacrificio?'<div class="info-row"><span class="k">Edad al sacrificio</span><span class="v">'+esc(edadSacrificio)+'</span></div>':'')+
        '<div class="info-row"><span class="k">Finca de origen</span><span class="v">La Marinilla</span></div>'+
        '<div class="info-row"><span class="k">Ubicación</span><span class="v">Vereda San Bernardo<br>Ibagué, Tolima</span></div>'+
        '<div class="info-row"><span class="k">Manejo</span><span class="v">Pastoreo adaptativo multipotrero</span></div>'+
        '<div class="attrs">'+
          '<span class="attr-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>100% pasto natural</span>'+
          '<span class="attr-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>Sin hormonas</span>'+
          '<span class="attr-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>Sin antibióticos profilácticos</span>'+
        '</div>'+
      '</div>'+

      // ── SECCIÓN 3 · TRAZABILIDAD ──
      '<div class="sec">'+
        '<div class="sec-h"><span class="n">3</span>Trazabilidad completa</div>'+
        (animal.codigo?'<div class="info-row"><span class="k">Identificación animal</span><span class="v">'+esc(animal.codigo)+(animal.nombre?' · '+esc(animal.nombre):'')+'</span></div>':'')+
        (animal.fecha_nacimiento?'<div class="info-row"><span class="k">Fecha de nacimiento</span><span class="v">'+fmtFecha(animal.fecha_nacimiento)+'</span></div>':'')+
        (ben.fecha?'<div class="info-row"><span class="k">Fecha de sacrificio</span><span class="v">'+fmtFecha(ben.fecha)+'</span></div>':'')+
        (ben.frigorifico?'<div class="info-row"><span class="k">Frigorífico</span><span class="v">'+esc(ben.frigorifico)+'</span></div>':'')+
        ((ben.peso_vivo_entrada||ben.peso_canal)?
          '<div class="flow">'+
            '<div class="flow-step"><div class="fv">'+esc(ben.peso_vivo_entrada||'—')+(ben.peso_vivo_entrada?' kg':'')+'</div><div class="fl">Peso vivo</div></div>'+
            '<div class="flow-arrow">→</div>'+
            '<div class="flow-step"><div class="fv">'+esc(ben.peso_canal||'—')+(ben.peso_canal?' kg':'')+'</div><div class="fl">Canal</div></div>'+
            '<div class="flow-arrow">→</div>'+
            '<div class="flow-step"><div class="fv">'+(ben.rendimiento_canal!=null?esc(Math.round(ben.rendimiento_canal*10)/10)+'%':'—')+'</div><div class="fl">Rendimiento</div></div>'+
          '</div>'
        :'')+
        (lote?'<div class="info-row"><span class="k">Lote de origen</span><span class="v">'+esc(lote)+'</span></div>':'')+
      '</div>'+

      // ── SECCIÓN 4 · SOBRE LAAAMB ──
      '<div class="about">'+
        '<h3>Sobre LAAAMB</h3>'+
        '<p>LAAAMB es un proyecto de ganadería ovina regenerativa en el Tolima. Criamos corderos en pastoreo adaptativo multipotrero, respetando el bienestar animal y la salud del suelo.</p>'+
        '<p>Cada animal es trazado desde su nacimiento hasta tu mesa. Este código QR es la prueba: una historia verificable de origen, manejo y calidad — del potrero a tu plato.</p>'+
      '</div>'+

      // FOOTER con QR
      '<div class="foot">'+
        '<div class="foot-qr" id="foot-qr"></div>'+
        '<div class="foot-line"><b>Powered by LAAAMBAPP</b> · Trazabilidad verificada<br>'+
        '<a href="https://laaambapp.vercel.app">laaambapp.vercel.app</a></div>'+
      '</div>';

    document.getElementById('root').innerHTML = html;

    // QR visual de esta misma página
    var fq = document.getElementById('foot-qr');
    if(fq && window.QRCode){
      new QRCode(fq, { text:window.location.href, width:128, height:128, colorDark:'#0a0f14', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.H });
    }
  }

  async function load(){
    var qrCode = window.location.pathname.split('/qr/')[1] || new URLSearchParams(window.location.search).get('code');
    if(!qrCode){ return noEncontrado(); }
    try{
      var resp = await window._sb.from('empaques')
        .select('*, cortes(tipo_corte, peso_kg), animales(codigo, nombre, raza, especie, fecha_nacimiento, notas, lotes(nombre)), beneficios(fecha, frigorifico, peso_vivo_entrada, peso_canal, rendimiento_canal)')
        .eq('qr_code', qrCode)
        .single();
      if(resp.error || !resp.data){ return noEncontrado(); }
      // Cadena de frío (último registro) — opcional
      var frio = [];
      try{
        var fr = await window._sb.from('cadena_frio')
          .select('temperatura_c, fecha_hora')
          .eq('empaque_id', resp.data.id)
          .order('fecha_hora', { ascending:false })
          .limit(1);
        frio = fr.data || [];
      }catch(e){}
      render(resp.data, frio);
    }catch(e){ noEncontrado(); }
  }
  load();
})();
</script>
</body>
</html>
